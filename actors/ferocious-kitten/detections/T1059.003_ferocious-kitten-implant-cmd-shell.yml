title: Ferocious Kitten MarkiRAT Command Shell Execution
id: e1b4a8c2-3f6b-4d0e-8a1b-2d5f9a0c4e6a
status: experimental
description: |
    Detects the Ferocious Kitten MarkiRAT arbitrary-command execution stage (T1059.003), in which the
    implant runs operator-supplied commands via cmd.exe /c. Keys on cmd.exe spawned by a MarkiRAT implant
    process (svehost.exe, update.exe, data.exe, or a binary in the implant staging paths) - process-lineage
    context is required because cmd.exe use alone is benign.
references:
    - https://securelist.com/ferocious-kitten-6-years-of-covert-surveillance-in-iran/102806/
author: mena-detection-library
date: 2026-08-31
tags:
    - attack.execution
    - attack.t1059.003
    - mena-detection-library.ferocious-kitten
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd.exe'
        CommandLine|contains: '/c'
    parent_names:
        ParentImage|endswith:
            - '\svehost.exe'
            - '\update.exe'
            - '\data.exe'
    parent_paths:
        ParentImage|contains:
            - '\Users\Public\AppData\Windows\'
            - '\Users\Public\'
            - '\AppData\Libs\'
    condition: selection and (parent_names or parent_paths)
falsepositives:
    - Legitimate tools installed under Public paths spawning cmd - baseline expected parents in the implant staging directories
level: high
