title: Ferocious Kitten Payload Masquerading as Legitimate Binary
id: c9f2e6a0-1d4f-4b8c-8e9f-0b3d7f8a2c4e
status: experimental
description: |
    Detects Ferocious Kitten MarkiRAT payloads that masquerade under legitimate names/locations
    (T1036.005): svehost.exe mimicking svchost.exe, and data.exe carrying the Telegram icon inside the
    Telegram data directory. Keys on process execution of svehost.exe (which is not a real Windows binary)
    and of data.exe launched from a Telegram tdata path.
references:
    - https://securelist.com/ferocious-kitten-6-years-of-covert-surveillance-in-iran/102806/
author: mena-detection-library
date: 2026-08-31
tags:
    - attack.stealth
    - attack.t1036.005
    - mena-detection-library.ferocious-kitten
logsource:
    category: process_creation
    product: windows
detection:
    selection_svehost:
        Image|endswith: '\svehost.exe'
    selection_dataexe:
        Image|endswith: '\data.exe'
        Image|contains: '\tdata'
    condition: selection_svehost or selection_dataexe
falsepositives:
    - Third-party applications shipping a generically named data.exe outside a Telegram path would not match; svehost.exe has no legitimate use
level: high
