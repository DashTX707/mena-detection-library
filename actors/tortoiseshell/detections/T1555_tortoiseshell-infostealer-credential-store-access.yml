title: Tortoiseshell Infostealer Access to Browser and Credential-Manager Stores
id: cd41fe2f-95c4-4a6e-b73e-1033c279cde1
status: experimental
description: |
    Detects credential theft from local password stores (T1555) by Tortoiseshell / Imperial Kitten
    infostealers (Sha.exe / Sha432.exe / stereoversioncontrol.exe), including browser Login Data stores
    (T1555.003) and the Windows Credential Manager / DPAPI vault (T1555.004). Keys on the named infostealer
    processes and on any non-browser process accessing browser credential databases or the Credential
    Manager vault paths via command line. Requires process-creation logging (file-access/EDR telemetry
    strengthens the store-access selectors).
references:
    - https://www.security.com/threat-intelligence/tortoiseshell-apt-supply-chain
    - https://www.crowdstrike.com/en-us/adversaries/imperial-kitten/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1555
    - attack.t1555.003
    - attack.t1555.004
    - mena-detection-library.tortoiseshell
logsource:
    category: process_creation
    product: windows
detection:
    selection_named:
        Image|endswith:
            - '\sha.exe'
            - '\sha432.exe'
            - '\stereoversioncontrol.exe'
    selection_store_paths:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\Login Data'
            - '\Microsoft\Credentials\'
            - '\Microsoft\Vault\'
            - '\Login Data For Account'
            - 'vaultcmd'
    condition: selection_named or selection_store_paths
falsepositives:
    - Browser backup/migration tools that legitimately read Login Data - baseline expected tooling
    - Credential-management / password-manager software accessing the vault - allowlist known publishers
level: high
