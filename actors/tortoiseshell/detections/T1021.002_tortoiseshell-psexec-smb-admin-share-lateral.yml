title: Tortoiseshell PsExec / PAExec SMB Admin-Share Lateral Movement
id: 87acfbaa-33ba-4ec6-8185-33418344f4f6
status: experimental
description: |
    Detects PsExec/PAExec lateral movement over SMB admin shares (T1021.002) used by Tortoiseshell /
    Imperial Kitten to execute payloads on remote hosts and spread within networks (several hundred hosts
    infected in some environments). Keys on the PSEXESVC/PAExec service-image and service creation, and on
    the service-host parentage tell of remote execution. Complements Security EID 7045 (service install) and
    5145 (admin-share access) auditing. Requires process-creation and/or System-log service-install logging.
references:
    - https://www.security.com/threat-intelligence/tortoiseshell-apt-supply-chain
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.lateral-movement
    - attack.t1021.002
    - mena-detection-library.tortoiseshell
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\PSEXESVC.exe'
            - '\PAExec.exe'
            - '\psexesvc.exe'
    selection_paexec_named:
        Image|contains: 'PAExec-'
    selection_svc_parent:
        ParentImage|endswith: '\services.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '\Windows\Temp\'
            - '\ProgramData\'
    condition: selection_image or selection_paexec_named or selection_svc_parent
falsepositives:
    - Legitimate administrative PsExec/PAExec use by IT teams - baseline authorized admin hosts and correlate
      with fanout/service-image in temp paths
    - Deployment tooling that installs transient services - allowlist known publishers
level: high
