title: StrongPity Trojanized Installer Spawning Dropped Component Processes
id: 3f9c1a52-8e47-4b21-9a6d-1c2f0b7e5a41
status: experimental
description: |
    Detects StrongPity / PROMETHIUM user-execution of a trojanized legitimate-software installer
    (WinRAR, TrueCrypt, CCleaner, VLC) that installs the decoy application while silently dropping and
    launching StrongPity components. Keys on an installer-named parent process spawning the actor's
    dropped component executables (procexp.exe, nvvscv.exe, wmpsvn32.exe, wndplyr.exe) whose names
    masquerade as legitimate utilities (T1204.002 User Execution, T1036.005 Match Legitimate Name or
    Location). The trojanized-installer parent names mirror the genuine vendor filenames.
references:
    - https://www.welivesecurity.com/2017/12/08/strongpity-like-spyware-replaces-finfisher/
    - https://securelist.com/on-the-strongpity-waterhole-attacks-targeting-italian-and-belgian-encryption-users/76147/
    - https://attack.mitre.org/software/S0491/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.execution
    - attack.stealth
    - attack.t1204.002
    - attack.t1036.005
    - mena-detection-library.strongpity
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|contains:
            - '\wrar'
            - '\winrar'
            - '\truecrypt'
            - '\ccleaner'
    selection_child:
        Image|endswith:
            - '\procexp.exe'
            - '\nvvscv.exe'
            - '\wmpsvn32.exe'
            - '\wndplyr.exe'
    condition: all of selection_*
falsepositives:
    - Genuine installers rarely spawn these specific child process names - validate the child image path,
      digital signature and any subsequent %temp% staging activity before dismissing
level: high
