title: StrongPity Dropped Component Executing With Untrusted Signature From Temp
id: 2b6d8f10-9c43-4a75-8e31-7f0a2c5d1b69
status: experimental
description: |
    Detects StrongPity / PROMETHIUM dropped components (procexp.exe, nvvscv.exe, wmpsvn32.exe,
    wndplyr.exe) executing from a user-writable staging path while carrying an unsigned or otherwise
    untrusted digital signature (T1553.002 Subvert Trust Controls: Code Signing). StrongPity signs its
    droppers with self-signed / actor certificates to appear trustworthy; a component running from
    %temp% / AppData with an invalid or missing signature is a strong subverted-trust signal. Anchored
    on execution behavior plus the signature status, not on a static hash.
references:
    - https://attack.mitre.org/software/S0491/
    - https://securelist.com/on-the-strongpity-waterhole-attacks-targeting-italian-and-belgian-encryption-users/76147/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.stealth
    - attack.t1553.002
    - mena-detection-library.strongpity
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\procexp.exe'
            - '\nvvscv.exe'
            - '\wmpsvn32.exe'
            - '\wndplyr.exe'
        Image|contains:
            - '\Temp\'
            - '\AppData\'
            - '\lang_'
    selection_sig:
        - Signed: 'false'
        - SignatureStatus|contains:
            - 'Expired'
            - 'Unavailable'
            - 'Error'
    condition: all of selection_*
falsepositives:
    - Environments without signature-metadata enrichment (Sysmon SignatureStatus / Signed fields) cannot
      populate these fields - if unavailable this rule will not fire and should be treated as a
      visibility gap rather than a clean result
level: high
