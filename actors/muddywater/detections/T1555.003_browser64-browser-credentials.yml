title: Browser Credential Store Theft via Browser64 (MuddyWater)
id: e6b90be5-7e59-46a3-b5fc-0b8c59ba114a
status: experimental
description: |
    Detects MuddyWater's Browser64 tool (and equivalent utilities) stealing passwords saved in
    web browsers. Keys on the Browser64 binary name/metadata and on process access to browser
    credential-store files (Login Data / logins.json) by non-browser processes.
references:
    - https://attack.mitre.org/groups/G0069/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.credential-access
    - attack.t1555.003
    - mena-detection-library.muddywater
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith: '\browser64.exe'
        - OriginalFileName: 'browser64.exe'
        - CommandLine|contains: 'browser64'
    selection_store_access:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Local State'
            - '\logins.json'
            - '\Login Data'
    condition: selection_tool or selection_store_access
falsepositives:
    - Backup or migration utilities that legitimately read browser profile files
    - Endpoint DLP or password-manager import tooling
level: high
