title: LaZagne Credential Harvesting Execution (MuddyWater)
id: 00c63239-bbd0-40f7-98a8-ff9434f73beb
status: experimental
description: |
    Detects execution of the LaZagne credential-recovery tool, which MuddyWater has used to dump
    LSA secrets, cached domain credentials, and credentials from password stores. Keys on the LaZagne
    binary name/metadata and its module arguments (all, browsers, mails) rather than a hash.
    Covers T1003.004 (LSA secrets), T1003.005 (cached domain credentials), and T1555 (password stores).
references:
    - https://attack.mitre.org/groups/G0069/
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-055a
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.credential-access
    - attack.t1003.004
    - attack.t1003.005
    - attack.t1555
    - mena-detection-library.muddywater
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\lazagne.exe'
        - OriginalFileName: 'lazagne.exe'
        - Description|contains: 'LaZagne'
    selection_cli:
        CommandLine|contains: 'laZagne'
    condition: selection_img or selection_cli
falsepositives:
    - Authorized password-audit or red-team activity using LaZagne
level: high
