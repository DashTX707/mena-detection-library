title: Local Proxy Settings Disabled via Registry (MuddyWater)
id: d6fe1437-a662-47ab-b4ae-2fe8eb36d46a
status: experimental
description: |
    Detects modification of the WinINET proxy configuration to disable the system's local proxy,
    matching MuddyWater's capability to disable local proxy settings (to route C2 unimpeded). Keys on
    registry writes to ProxyEnable/ProxyServer under the Internet Settings key.
references:
    - https://attack.mitre.org/groups/G0069/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.stealth
    - attack.t1685
    - mena-detection-library.muddywater
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings\'
        TargetObject|endswith:
            - '\ProxyEnable'
            - '\ProxyServer'
            - '\ProxyOverride'
    filter_enable:
        TargetObject|endswith: '\ProxyEnable'
        Details: 'DWORD (0x00000000)'
    condition: selection and filter_enable
falsepositives:
    - Users or GPO toggling proxy settings during legitimate network changes
    - Browsers/VPN clients that manage WinINET proxy configuration
level: medium
