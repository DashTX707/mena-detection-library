title: Ingress Tool Transfer via PowerShell Download / RMM Installer (MuddyWater)
id: 5d8344e4-67da-426b-95b8-445049380be2
status: experimental
description: |
    Detects file download to disk via PowerShell / LOLBins and installation of remote-management (RMM)
    software, matching MuddyWater's use of PowerShell to pull additional files and install RMM tooling
    on victim machines. Keys on DownloadFile/Invoke-WebRequest-to-path, certutil/bitsadmin downloads,
    and curl/msiexec fetching remote payloads.
references:
    - https://attack.mitre.org/groups/G0069/
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-055a
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.command-and-control
    - attack.t1105
    - mena-detection-library.muddywater
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps_download:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'DownloadFile('
            - 'Invoke-WebRequest'
            - 'Start-BitsTransfer'
            - 'wget '
            - 'curl '
        CommandLine|contains:
            - '-outfile'
            - '.exe'
            - '.dll'
            - '.msi'
            - '\Temp\'
            - '\ProgramData\'
    selection_lolbin_download:
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\curl.exe'
        CommandLine|contains:
            - '-urlcache'
            - '/transfer'
            - 'http://'
            - 'https://'
    condition: selection_ps_download or selection_lolbin_download
falsepositives:
    - Software deployment and patching tools that download installers
    - Legitimate use of BITS/certutil for content delivery (baseline destinations)
level: medium
