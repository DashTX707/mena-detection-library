title: Base64 Decode Routine via certutil / PowerShell (MuddyWater)
id: 65e8b958-d228-47c3-b8fb-e4dd5751dd22
status: experimental
description: |
    Detects on-host decoding of encoded payloads, matching MuddyWater's decoding of base64-encoded
    PowerShell, JavaScript, and VBScript. Keys on certutil -decode and PowerShell FromBase64String
    with a byte-to-file/IEX sink.
references:
    - https://attack.mitre.org/groups/G0069/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.stealth
    - attack.t1140
    - mena-detection-library.muddywater
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-decode'
            - '/decode'
            - 'decodehex'
    selection_ps_decode:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains: 'FromBase64String'
    condition: selection_certutil or selection_ps_decode
falsepositives:
    - Administrative scripts that legitimately decode base64 configuration blobs
    - certutil used for certificate encoding/decoding in PKI workflows
level: medium
