title: Domestic Kitten Removable-Drive / Volume Enumeration
id: 3f0f85c3-f919-4a0c-8ed8-fa46deeec33a
status: experimental
description: |
    Detects command-line enumeration of local volumes and removable/USB drives, consistent with the
    HookInjEx (Rampant Kitten) stealer surveying attached drives to locate additional data to collect
    (T1120 Peripheral Device Discovery). Keys on the common built-in utilities used to list drives.
    Note: HookInjEx performs drive enumeration via Windows API from inside the injected process, which
    is not captured here - this rule covers the CLI-based enumeration surface and should be paired with
    EDR process-behaviour analytics to close the API-only gap.
references:
    - https://research.checkpoint.com/2020/rampant-kitten-an-iranian-espionage-campaign/
author: mena-detection-library
date: 2026-08-31
tags:
    - attack.discovery
    - attack.t1120
    - mena-detection-library.domestic-kitten
logsource:
    category: process_creation
    product: windows
detection:
    selection_fsutil:
        Image|endswith: '\fsutil.exe'
        CommandLine|contains: 'drives'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'logicaldisk'
            - 'diskdrive'
    selection_mountvol:
        Image|endswith: '\mountvol.exe'
    selection_ps:
        CommandLine|contains:
            - 'Get-Volume'
            - 'Get-PSDrive'
            - 'Win32_LogicalDisk'
    condition: 1 of selection_*
falsepositives:
    - Administrative scripts, inventory/asset-management agents and backup tooling routinely enumerate
      drives - baseline expected sources and schedule this against known automation
level: low
