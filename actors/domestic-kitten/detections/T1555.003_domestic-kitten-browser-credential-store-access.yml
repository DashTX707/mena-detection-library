title: Domestic Kitten Browser Credential Store Access by Unexpected Process
id: ac9638c9-4d83-49a5-b170-a9269a69336c
status: experimental
description: |
    Detects access to web-browser saved-credential stores by a process that is not the owning browser,
    consistent with the Python infostealer and HookInjEx (Rampant Kitten) harvesting saved passwords
    from Chrome, Edge, Firefox and Opera (T1555.003 Credentials from Web Browsers). Requires
    object-access auditing (Windows Security Event ID 4663) with SACLs on the browser profile
    credential files (Chromium 'Login Data'/'Web Data', Firefox 'logins.json'/'key4.db').
references:
    - https://research.checkpoint.com/2020/rampant-kitten-an-iranian-espionage-campaign/
author: mena-detection-library
date: 2026-08-31
tags:
    - attack.credential-access
    - attack.t1555.003
    - mena-detection-library.domestic-kitten
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4663
        ObjectName|endswith:
            - '\Login Data'
            - '\Web Data'
            - '\logins.json'
            - '\key4.db'
    filter_browser:
        ProcessName|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\opera.exe'
            - '\brave.exe'
    condition: selection and not filter_browser
falsepositives:
    - Backup, sync or endpoint-DLP agents reading browser profile directories - allowlist those
      specific processes
    - Browser profile-migration or password-import utilities run intentionally by the user
level: high
