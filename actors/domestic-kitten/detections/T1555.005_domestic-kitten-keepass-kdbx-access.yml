title: Domestic Kitten KeePass .kdbx Database Access by Non-KeePass Process
id: 90cf7a94-4e02-4063-9d79-464cc0509dee
status: experimental
description: |
    Detects access to KeePass password-manager databases (.kdbx) by a process other than KeePass,
    consistent with the TelB (Rampant Kitten) infostealer harvesting the master credential store
    (T1555.005 Credentials from Password Stores: Password Managers). Requires object-access auditing
    (Windows Security Event ID 4663) with a SACL on .kdbx files or their containing directories. High
    signal - password databases are rarely opened by anything but the manager itself.
references:
    - https://research.checkpoint.com/2020/rampant-kitten-an-iranian-espionage-campaign/
author: mena-detection-library
date: 2026-08-31
tags:
    - attack.credential-access
    - attack.t1555.005
    - mena-detection-library.domestic-kitten
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4663
        ObjectName|endswith: '.kdbx'
    filter_keepass:
        ProcessName|endswith:
            - '\KeePass.exe'
            - '\KeePassXC.exe'
    condition: selection and not filter_keepass
falsepositives:
    - Backup, sync (OneDrive/Dropbox) or indexing agents touching the .kdbx file - allowlist those
      specific processes
    - The user opening the database in an alternate/portable client - confirm the process is expected
level: high
