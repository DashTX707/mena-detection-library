title: OilAlpha Fake Credential-Theft Web Portal (kssnew.online)
id: f2989a5b-9c8c-4e56-a976-f52f5ae56e37
status: experimental
description: |
    Detects connections to kssnew.online, the fake credential-harvesting web portal operated by
    OilAlpha that spoofs the NRC, CARE International (kssnew.online/care/index.php) and King Salman
    Humanitarian Aid and Relief Centre (KSR) login pages (T1056.003 Input Capture: Web Portal
    Capture). Infected devices are redirected to this portal to submit their organizational
    username/password. Fires on proxy/web telemetry where victim browser traffic transits a
    monitored network.
references:
    - https://assets.recordedfuture.com/insikt-report-pdfs/2024/cta-2024-0709.pdf
author: mena-detection-library
date: 2026-08-31
tags:
    - attack.credential-access
    - attack.t1056.003
    - mena-detection-library.oilalpha
logsource:
    category: proxy
detection:
    selection:
        cs-host: 'kssnew.online'
    condition: selection
falsepositives:
    - None expected - kssnew.online is a dedicated OilAlpha credential-theft domain. Any hit means
      a user reached the phishing portal; check whether credentials were POSTed and force a reset.
level: high
