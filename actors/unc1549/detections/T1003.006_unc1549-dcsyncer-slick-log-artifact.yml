title: UNC1549 DCSYNCER.SLICK LOG.txt Output and DC Machine-Account Reset
id: 23d97f76-c987-4561-a6fd-d1ae7081589d
status: experimental
description: |
    Detects host-level corroboration of UNC1549 / TA455 DCSync activity (T1003.006). The DCSYNCER.SLICK
    utility writes its harvested credential dump to LOG.txt under C:\Users\Public\ or the VMware VGAuth
    directory, and the actor has been observed resetting a domain controller computer-account password
    (e.g. "net user DC-01$ P@ssw0rd") to enable the replication context. DCSYNCER.SLICK also relies on
    dynamic/runtime API resolution from encoded strings (T1027.007) to hinder static analysis. This rule
    keys on the two observable host behaviours: the LOG.txt artifact write and the anomalous computer-
    account password reset via net.exe.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/analysis-of-unc1549-ttps-targeting-aerospace-defense
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.stealth
    - attack.t1003.006
    - attack.t1027.007
    - mena-detection-library.unc1549
logsource:
    product: windows
    category: process_creation
detection:
    selection_dcreset:
        Image|endswith: '\net.exe'
        CommandLine|contains: ' user '
        CommandLine|re: '\s\S+\$\s'
    condition: selection_dcreset
falsepositives:
    - Administrators legitimately resetting a computer-account password via net.exe is rare - verify the
      target account, the operator and the source host
level: high
