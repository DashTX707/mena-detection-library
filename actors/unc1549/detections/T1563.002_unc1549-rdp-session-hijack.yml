title: UNC1549 RDP Session Hijacking via tscon Session Takeover
id: c13fc9ac-4ab2-4182-9bda-991a9345e9aa
status: experimental
description: |
    Detects UNC1549 / TA455 RDP session hijacking (T1563.002), whereby the actor takes over an existing
    RDP session of an active user (e.g. via SYSTEM-context tscon) to move laterally using another user's
    authenticated context. Two observable signals: SYSTEM-context tscon.exe process creation performing a
    session connect, and session-reconnect security events (Event ID 4778 session reconnected) where the
    reconnecting account differs from the session's original owner. Keys on the tscon behaviour plus the
    reconnect event.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/analysis-of-unc1549-ttps-targeting-aerospace-defense
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.lateral-movement
    - attack.t1563.002
    - mena-detection-library.unc1549
logsource:
    product: windows
    category: process_creation
detection:
    selection_tscon:
        Image|endswith: '\tscon.exe'
    selection_context:
        User|contains:
            - 'SYSTEM'
            - 'AUTORITE NT'
            - 'AUTORITÉ NT'
    condition: all of selection_*
falsepositives:
    - Administrative shadow/session-transfer tooling that legitimately invokes tscon - verify the source
      user, the target session owner and the business justification
level: high
