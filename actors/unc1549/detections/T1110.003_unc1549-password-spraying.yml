title: UNC1549 Password Spraying Authentication-Failure Fan-Out
id: f6ad5999-1452-4ee0-94f8-863c5a32541c
status: experimental
description: |
    Detects UNC1549 / TA455 password-spraying (T1110.003) against the domain to obtain additional valid
    credentials. Password spraying manifests as many distinct target accounts each failing authentication
    a small number of times, driven from a small set of source hosts within a short window. The base rule
    keys on Windows Security Event ID 4625 (failed logon) with a bad-password sub-status; the correlation
    fires when a single source IP accumulates failed logons across many attempts in a 15-minute window.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/analysis-of-unc1549-ttps-targeting-aerospace-defense
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1110.003
    - mena-detection-library.unc1549
name: unc1549_password_spray_failed_logon
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        SubStatus:
            - '0xC000006A'
            - '0xC0000064'
    condition: selection
falsepositives:
    - Misconfigured service accounts or applications with stale credentials causing broad logon failures -
      exclude known service source hosts and validate the account spread and source before alerting
level: high
---
title: UNC1549 Password Spraying Source Fan-Out Correlation
id: 735335dd-9b37-44d0-8db3-e2f9d74e5fbd
status: experimental
description: |
    Fires when a single source IP produces a burst of failed logons consistent with UNC1549 / TA455
    password spraying across many accounts within a short window.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/analysis-of-unc1549-ttps-targeting-aerospace-defense
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1110.003
    - mena-detection-library.unc1549
correlation:
    type: event_count
    rules:
        - unc1549_password_spray_failed_logon
    group-by:
        - IpAddress
    timespan: 15m
    condition:
        gte: 15
falsepositives:
    - Misconfigured service accounts or applications with stale credentials causing broad logon failures
level: high
