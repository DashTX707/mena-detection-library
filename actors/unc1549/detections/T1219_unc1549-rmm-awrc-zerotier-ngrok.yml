title: UNC1549 Unsanctioned Remote-Access Tooling (AWRC, ZeroTier, ngrok)
id: f7316ed0-12d8-45e3-90bf-34c7f3ebefb3
status: experimental
description: |
    Detects UNC1549 / TA455 use of commercial and open remote-access tooling for command-and-control
    (T1219). The actor uses Atelier Web Remote Commander (AWRC) for reconnaissance, credential theft and
    malware deployment, and falls back to ZeroTier and ngrok for resilient access after remediation. Keys
    on process creation of these tools' binaries. In an aerospace/defense enterprise these tools are
    typically unsanctioned; correlate with outbound connections to their service endpoints
    (ZeroTier planet servers, *.ngrok.io) where network telemetry is available.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/analysis-of-unc1549-ttps-targeting-aerospace-defense
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.command-and-control
    - attack.t1219
    - mena-detection-library.unc1549
logsource:
    product: windows
    category: process_creation
detection:
    selection_awrc:
        Image|endswith:
            - '\awrc.exe'
            - '\AWRemoteCommander.exe'
    selection_zerotier:
        Image|endswith:
            - '\zerotier-one_x64.exe'
            - '\zerotier-one_x86.exe'
            - '\zerotier-cli.exe'
    selection_ngrok:
        Image|endswith: '\ngrok.exe'
    selection_ngrok_desc:
        Product|contains: 'ngrok'
    condition: 1 of selection_*
falsepositives:
    - Sanctioned use of these tools by IT/network teams - if any are approved, allowlist by host and
      signed publisher and alert only on unexpected endpoints
level: high
