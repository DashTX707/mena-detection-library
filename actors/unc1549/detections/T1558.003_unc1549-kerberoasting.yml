title: UNC1549 Kerberoasting SPN Request Burst Correlation
id: 2008f190-dd22-448a-b44d-fa678698e493
status: experimental
description: |
    Fires when a single account requests many weak-encryption Kerberos service tickets in a short window,
    consistent with UNC1549 / TA455 Kerberoasting SPN enumeration for offline cracking.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/analysis-of-unc1549-ttps-targeting-aerospace-defense
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1558.003
    - mena-detection-library.unc1549
correlation:
    type: event_count
    rules:
        - unc1549_kerberoast_rc4_tgs
    group-by:
        - TargetUserName
    timespan: 10m
    condition:
        gte: 10
falsepositives:
    - Legacy applications or scanners that request many RC4 service tickets
level: high
