title: Charming Kitten MFA Fatigue Push-Bombing and App-Password MFA Bypass (Entra ID)
id: 5349a00d-5ada-4249-b168-3683e4441fa0
status: experimental
description: |
    Detects the APT42 MFA-bypass tradecraft against Microsoft 365 / Entra ID: (1) MFA-fatigue / push
    bombing (T1621) - a burst of repeated MFA challenges, typically surfaced as many failed
    strong-authentication attempts (ResultType 500121 - authentication failed during MFA) for one user in
    a short window, which Mandiant observed succeeding after cloned-page token capture failed; and (2)
    abuse of Microsoft app passwords (T1556.006) - single-use passwords that do not require MFA, generated
    to establish continuous MFA-free access. Keys on the sign-in / audit-log signals for both. High
    fidelity on the app-password registration event; the push-bombing arm benefits from a per-user
    count threshold applied in the SIEM. Requires Entra ID sign-in and audit logs.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/untangling-iran-apt42-operations
    - https://attack.mitre.org/groups/G0059
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.defense-impairment
    - attack.t1621
    - attack.t1556.006
    - mena-detection-library.charming-kitten
logsource:
    product: azure
    service: signinlogs
detection:
    selection_mfa_denied:
        ResultType:
            - 500121
            - 50074
            - 50076
    selection_app_password:
        AuthenticationRequirement: 'singleFactorAuthentication'
        ClientAppUsed|contains:
            - 'IMAP'
            - 'POP'
            - 'SMTP'
            - 'Other clients'
    condition: selection_mfa_denied or selection_app_password
falsepositives:
    - Users legitimately fumbling MFA prompts - apply a threshold (e.g. >=5 denials in 10 min for a single
      user followed by a success) rather than alerting on a single denial
    - Sanctioned legacy-auth / app-password mail clients - baseline and allowlist known service accounts;
      alert on app-password creation (Entra audit OperationName 'Register app password') for new principals
level: high
