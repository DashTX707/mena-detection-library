title: Charming Kitten Wi-Fi Credential Discovery (netsh wlan show profile key=clear)
id: 3a5b603a-6335-449c-bc5a-12909468d1dd
status: experimental
description: |
    Detects the distinctive CharmPower-style Wi-Fi credential enumeration used by Charming Kitten
    (T1016.002): 'netsh wlan show profile ... key=clear' to reveal saved wireless network names and
    plaintext passphrases, and bulk 'netsh wlan show profiles'. The 'key=clear' argument is a high-fidelity
    command-line tell rarely seen in normal administration. Requires process-creation logging with command
    lines.
references:
    - https://attack.mitre.org/groups/G0059
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.discovery
    - attack.t1016.002
    - mena-detection-library.charming-kitten
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
            - 'wlan'
            - 'show'
            - 'profile'
    selection_clear:
        CommandLine|contains: 'key=clear'
    condition: selection and selection_clear
falsepositives:
    - IT/helpdesk troubleshooting saved wireless profiles - rare with key=clear; verify the operator and
      host context
level: high
