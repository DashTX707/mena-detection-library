title: Charming Kitten LSASS Memory Access for Credential Dumping
id: 5f97f8cd-3e4b-4e8d-8900-c03c98fe41bc
status: experimental
description: |
    Detects credential access via LSASS memory dumping (T1003.001) on hosts compromised by Charming Kitten
    to obtain additional accounts. Keys on cross-process access (Sysmon EID 10) to lsass.exe requesting a
    mask that combines PROCESS_VM_READ (0x0010) and PROCESS_QUERY_(LIMITED_)INFORMATION - e.g. the classic
    0x1010 / 0x1410 / 0x1438 masks used by tools that read LSASS memory - from a non-allowlisted source
    process. The access mask is an implementation-core (L4) observable robust to tool renaming. Requires
    Sysmon EID 10 (ProcessAccess) telemetry - without it this rule will not populate (visibility gap).
references:
    - https://attack.mitre.org/groups/G0059
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.t1003.001
    - mena-detection-library.charming-kitten
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    filter_known:
        SourceImage|endswith:
            - '\wininit.exe'
            - '\MsMpEng.exe'
            - '\csrss.exe'
            - '\services.exe'
    condition: selection and not filter_known
falsepositives:
    - EDR agents, AV and legitimate memory-inspection tools that open LSASS - baseline the SourceImage set
    - Some backup/diagnostic tools request broad masks - tune the allowlist to your environment
level: high
