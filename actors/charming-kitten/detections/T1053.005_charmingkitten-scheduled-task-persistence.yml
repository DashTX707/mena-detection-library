title: Charming Kitten Scheduled Task Creation for Persistence
id: 57bd2f61-2fbb-447d-ac96-d303cdd1373d
status: experimental
description: |
    Detects scheduled-task creation used by Charming Kitten for execution/persistence of its implants
    (T1053.005). Keys on schtasks.exe /create (or PowerShell Register-ScheduledTask) whose action launches
    a command interpreter or script host (cmd, powershell, wscript, cscript, mshta, rundll32) or a binary
    from a user-writable path - the tell of a persistence task rather than a benign software task. Pair with
    Security EID 4698 (task registered). Requires process-creation logging with command lines.
references:
    - https://attack.mitre.org/groups/G0059
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.persistence
    - attack.t1053.005
    - mena-detection-library.charming-kitten
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith: '\schtasks.exe'
          CommandLine|contains: '/create'
        - CommandLine|contains: 'Register-ScheduledTask'
    selection_action:
        CommandLine|contains:
            - 'cmd.exe'
            - 'powershell'
            - 'pwsh'
            - 'wscript'
            - 'cscript'
            - 'mshta'
            - 'rundll32'
            - 'curl'
            - '\AppData\'
            - '\Users\Public\'
            - '\ProgramData\'
            - '\Temp\'
    condition: selection_tool and selection_action
falsepositives:
    - Software installers and management tools that register tasks invoking scripts - baseline known
      task names and publishers
    - Legitimate admin automation - scope to tasks whose action runs from user-writable paths
level: medium
