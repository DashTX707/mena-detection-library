title: Browser Credential Theft via BrowserPasswordDump10 / Login Data Access (Gaza Cybergang)
id: 68f4715f-2de6-4442-8c1c-6a47d3a227b8
status: experimental
description: |
    Detects Gaza Cybergang / Molerats browser credential theft, matching the group's use of the public
    tool BrowserPasswordDump10 to dump passwords saved in victim browsers. Keys on the tool binary
    name/metadata and on a non-browser process accessing browser Login Data / logins.json credential
    stores.
references:
    - https://attack.mitre.org/groups/G0021/
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.t1555.003
    - mena-detection-library.gaza-cybergang
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith:
              - '\BrowserPasswordDump10.exe'
              - '\BrowserPasswordDump.exe'
        - OriginalFileName:
              - 'BrowserPasswordDump10.exe'
              - 'BrowserPasswordDump.exe'
    selection_store_access:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Local State'
            - '\logins.json'
            - '\key4.db'
            - '\signons.sqlite'
    filter_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
    condition: selection_tool or (selection_store_access and not filter_browser)
falsepositives:
    - Backup or profile-migration utilities that legitimately read browser profile files
    - Endpoint DLP or password-manager import tooling
level: high
