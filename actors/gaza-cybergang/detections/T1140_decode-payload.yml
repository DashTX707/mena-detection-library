title: On-Host Payload Decode/Decompress via certutil / PowerShell (Gaza Cybergang)
id: c9a5ad0c-accf-44a3-ba55-484a42c8ff5f
status: experimental
description: |
    Detects on-host decoding/decompression of staged payloads, matching Gaza Cybergang / Molerats
    decompression of ZIP files on the victim and runtime decoding of encoded payloads (Spark, SharpStage,
    DropBook). Keys on certutil -decode, PowerShell FromBase64String/Expand-Archive routines and
    Expand-Archive of archives from user-writable paths.
references:
    - https://attack.mitre.org/groups/G0021/
    - https://attack.mitre.org/software/S0543/
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.stealth
    - attack.t1140
    - mena-detection-library.gaza-cybergang
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-decode'
            - '/decode'
            - 'decodehex'
    selection_ps_decode:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'FromBase64String'
            - 'Expand-Archive'
            - '::Decompress'
            - 'GzipStream'
            - 'DeflateStream'
    condition: selection_certutil or selection_ps_decode
falsepositives:
    - Administrative scripts that legitimately decode base64 configuration blobs or expand archives
    - certutil used for certificate encoding/decoding in PKI workflows
level: medium
