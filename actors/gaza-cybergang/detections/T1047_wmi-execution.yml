title: WMI Process Creation for Execution and Recon (Gaza Cybergang)
id: 0ee508a1-42f0-414a-879e-7880de87e767
status: experimental
description: |
    Detects use of WMI to spawn processes, matching Gaza Cybergang / Molerats use of WMI for execution and
    host reconnaissance by SharpStage and MoleNet. Keys on wmic process call create and on WmiPrvSE
    spawning script interpreters or shells, both of which indicate WMI-driven execution rather than benign
    queries.
references:
    - https://attack.mitre.org/groups/G0021/
    - https://attack.mitre.org/software/S0546/
    - https://attack.mitre.org/software/S0553/
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.execution
    - attack.t1047
    - mena-detection-library.gaza-cybergang
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'process'
            - 'call'
            - 'create'
    selection_wmiprvse_child:
        ParentImage|endswith: '\WmiPrvSE.exe'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: selection_wmic or selection_wmiprvse_child
falsepositives:
    - Legitimate remote administration and software deployment that uses wmic process call create
    - Monitoring agents invoking scripts through WMI
level: medium
