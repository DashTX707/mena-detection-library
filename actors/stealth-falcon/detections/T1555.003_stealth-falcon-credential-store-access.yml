title: Stealth Falcon Access to Browser and Windows Credential Stores
id: 6e2b9d43-1c75-4a80-b6f9-3d8c5a1e7b62
status: experimental
description: |
    Detects Stealth Falcon (FruityArmor) credential theft from web browser credential stores and the
    Windows Credential Manager / Vault (T1555.003 Credentials from Web Browsers, T1555.004 Windows
    Credential Manager). Keys on processes referencing browser profile credential files (Login Data /
    logins.json) or invoking vaultcmd, and on scripted PowerShell touching those paths - behavior of
    the backdoor harvesting saved credentials. Anchor is access to the credential-store artifacts,
    not a specific tool hash.
references:
    - https://attack.mitre.org/groups/G0038/
    - https://www.welivesecurity.com/2019/09/09/backdoor-stealth-falcon-group/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1555.003
    - attack.t1555.004
    - mena-detection-library.stealth-falcon
logsource:
    category: process_creation
    product: windows
detection:
    selection_vaultcmd:
        Image|endswith: '\vaultcmd.exe'
        CommandLine|contains:
            - '/list'
            - '/listcreds'
    selection_browserstore:
        CommandLine|contains:
            - '\User Data\'
            - '\Login Data'
            - 'logins.json'
            - '\Microsoft\Vault\'
            - '\Microsoft\Credentials\'
    condition: selection_vaultcmd or selection_browserstore
falsepositives:
    - Backup, migration or password-manager utilities may read these paths - correlate with the parent
      process and whether it belongs to the macro/VBS/backdoor lineage
level: medium
