title: Tropic Trooper Crowdoor Injection into colorcpl.exe
id: 8d2e6b39-7a4c-4f18-9c53-1e6a2b7d4f85
status: experimental
description: |
    Detects Tropic Trooper (KeyBoy / Earth Centaur) injecting the decrypted Crowdoor payload into the
    legitimate Windows utility colorcpl.exe (T1055.001 Process Injection: DLL Injection, T1055 Process
    Injection). The loader launches colorcpl.exe with the command-line argument "2" and injects
    shellcode so C2 activity runs under a trusted, signed process. Keys on two behaviors: colorcpl.exe
    started with the anomalous argument and/or by an unusual parent, and cross-process access to
    colorcpl.exe requesting inject/write memory rights. colorcpl.exe (the Color Management control panel)
    is normally launched interactively by control.exe/explorer.exe with no numeric argument, so an
    unusual parent or lone "2" argument is anomalous.
references:
    - https://securelist.com/new-tropic-trooper-web-shell-infection/113737/
    - https://attack.mitre.org/groups/G0081/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1055.001
    - attack.t1055
    - mena-detection-library.tropic-trooper
logsource:
    category: process_creation
    product: windows
detection:
    selection_colorcpl:
        Image|endswith: '\colorcpl.exe'
        CommandLine|endswith: ' 2'
    filter_legit_parent:
        ParentImage|endswith:
            - '\control.exe'
            - '\explorer.exe'
            - '\rundll32.exe'
    condition: selection_colorcpl and not filter_legit_parent
falsepositives:
    - Interactive launches of the Color Management applet from Control Panel - these come from
      control.exe/explorer.exe and rarely carry a bare numeric argument; validate the parent process
level: high
