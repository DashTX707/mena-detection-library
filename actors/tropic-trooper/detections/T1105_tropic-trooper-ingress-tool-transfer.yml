title: Tropic Trooper Ingress Tool Transfer via Web Shell and LOLBins
id: 7c2a9e46-3f8b-4d15-9a6c-1e4b7d2f5a83
status: experimental
description: |
    Detects Tropic Trooper (KeyBoy / Earth Centaur) transferring follow-on tooling (Fscan, Swor,
    Neo-reGeorg, Crowdoor loader DLLs and side-load host binaries) onto compromised hosts (T1105 Ingress
    Tool Transfer). Delivery happens through the web shell and C2 channel, so tooling either lands via
    the IIS worker process writing executables/DLLs to disk, or via download LOLBins (certutil -urlcache,
    bitsadmin /transfer, curl/wget) invoked from a shell. Keys on two behaviors: w3wp.exe creating
    executable/DLL files outside normal web-content paths, and download-utility command lines fetching
    remote payloads.
references:
    - https://securelist.com/new-tropic-trooper-web-shell-infection/113737/
    - https://attack.mitre.org/groups/G0081/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.command-and-control
    - attack.t1105
    - mena-detection-library.tropic-trooper
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-urlcache'
            - '-verifyctl'
            - '-split'
    selection_bits:
        Image|endswith: '\bitsadmin.exe'
        CommandLine|contains: '/transfer'
    selection_curl:
        Image|endswith:
            - '\curl.exe'
            - '\wget.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
    selection_webshell_download:
        ParentImage|endswith: '\w3wp.exe'
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\curl.exe'
            - '\powershell.exe'
    condition: selection_certutil or selection_bits or selection_curl or selection_webshell_download
falsepositives:
    - Administrators and software-deployment tools use certutil/bitsadmin/curl for legitimate downloads -
      baseline expected usage; download utilities spawned by w3wp.exe or fetching from unknown hosts are
      the actor signal
level: medium
