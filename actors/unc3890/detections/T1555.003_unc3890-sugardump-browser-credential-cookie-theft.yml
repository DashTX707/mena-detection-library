title: UNC3890 SUGARDUMP Browser Credential and Cookie Store Access
id: e5d4c3b2-a190-4877-9665-f4e3d2c1b0a1
status: experimental
description: |
    Detects the UNC3890 (Operation Sugarush) SUGARDUMP stealer harvesting saved credentials
    (T1555.003 Credentials from Web Browsers) and session cookies (T1539 Steal Web Session Cookie). A
    non-browser process accesses browser credential and cookie stores across multiple browsers in one
    execution - Chrome (\Google\Chrome\User Data), Opera (\Opera Software\Opera Stable), Edge
    (\Microsoft\Edge\User Data) and Firefox (\Mozilla\Firefox\Profiles), targeting 'Login Data',
    'Cookies' and 'Web Data'. Keys on file access/copy of these stores by an Image that is not the
    owning browser.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/suspected-iranian-actor-targeting-israeli-shipping
    - https://thehackernews.com/2022/08/suspected-iranian-hackers-targeted.html
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1555.003
    - attack.t1539
    - mena-detection-library.unc3890
logsource:
    category: file_event
    product: windows
detection:
    selection_stores:
        TargetFilename|contains:
            - '\Google\Chrome\User Data\'
            - '\Opera Software\Opera Stable\'
            - '\Microsoft\Edge\User Data\'
            - '\Mozilla\Firefox\Profiles\'
        TargetFilename|endswith:
            - '\Login Data'
            - '\Cookies'
            - '\Web Data'
            - '\logins.json'
            - '\cookies.sqlite'
    filter_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\opera.exe'
            - '\msedge.exe'
            - '\firefox.exe'
    condition: selection_stores and not filter_browser
falsepositives:
    - Backup, sync or endpoint-management agents may touch browser profile files - allowlist the
      specific signed agent Image rather than broadly suppressing
level: high
