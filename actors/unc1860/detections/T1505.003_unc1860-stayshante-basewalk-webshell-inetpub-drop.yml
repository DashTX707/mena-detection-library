title: Web Shell Written to IIS Content Directory - STAYSHANTE/BASEWALK (UNC1860 VIROGREEN)
id: 7ee407f7-96fc-40fd-885e-751d0d1c6999
status: experimental
description: |
    Detects UNC1860 web-shell persistence via file-creation telemetry (Sysmon EID 11). Under the VIROGREEN
    SharePoint-exploitation framework the actor deploys the STAYSHANTE passive web shell (disguised as
    legitimate Windows server files) and the BASEWALK backdoor into IIS/SharePoint web-content directories to
    provide persistent operator access and stage follow-on passive implants (T1505.003). Keys on
    creation/modification of server-executable web content (.aspx/.asmx/.ashx/.asax) or dynamically-compiled
    App_Web_*.dll assemblies under IIS content roots (inetpub, SharePoint/Exchange virtual dirs) by an IIS
    worker (w3wp.exe) or an interactive shell, which is abnormal outside a controlled deployment. Because
    STAYSHANTE masquerades as a legitimate server filename, key on path + writer lineage rather than name.
references:
    - https://securityaffairs.com/168656/apt/unc1860-provides-iran-linked-apts-access-middle-east.html
    - https://thehackernews.com/2024/09/iranian-apt-unc1860-linked-to-mois.html
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.persistence
    - attack.t1505.003
    - mena-detection-library.unc1860
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - '\inetpub\wwwroot\'
            - '\inetpub\'
            - '\Web Server Extensions\'
            - '\FrontEnd\HttpProxy\'
            - '\ClientAccess\'
            - '\owa\'
            - '\ecp\'
    selection_ext:
        TargetFilename|endswith:
            - '.aspx'
            - '.asmx'
            - '.ashx'
            - '.asax'
    selection_appweb:
        TargetFilename|contains: '\App_Web_'
        TargetFilename|endswith: '.dll'
    selection_writer:
        Image|endswith:
            - '\w3wp.exe'
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    filter_compiler:
        Image|endswith:
            - '\csc.exe'
            - '\vbc.exe'
            - '\aspnet_compiler.exe'
    condition: (selection_path and selection_ext and selection_writer or selection_appweb and selection_writer) and not filter_compiler
falsepositives:
    - Legitimate application deployments/updates writing .aspx or precompiled assemblies (scope to change windows)
    - Runtime ASP.NET compilation spawned oddly may still surface despite the compiler exclusion
level: high
