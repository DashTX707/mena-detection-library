title: Madi Right-to-Left-Override (RTLO) Filename Masquerade
id: 8eb652d3-6c61-4298-a611-2047bdddaf4d
status: experimental
description: |
    Detects the Madi / Mahdi campaign use of the Unicode Right-to-Left-Override character (U+202E)
    embedded in filenames (T1036.002 Masquerading: Right-to-Left Override) so that an executable such
    as a '.scr' screensaver renders to the victim as a benign image (e.g. displayed as 'picturcs..jpg'
    with an image icon). Keys on the raw U+202E byte sequence appearing in the process image path or
    command line — a high-signal, technique-core artifact that is legitimate almost nowhere in normal
    Windows execution. RETIRED campaign; behavioral/reference coverage for the RTLO technique.
references:
    - https://securelist.com/the-madi-campaign-part-i-5/33693/
author: mena-detection-library
date: 2026-08-31
tags:
    - attack.stealth
    - attack.t1036.002
    - mena-detection-library.madi
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        - Image|contains: "‮"
        - CommandLine|contains: "‮"
        - OriginalFileName|contains: "‮"
    condition: selection
falsepositives:
    - Extremely rare legitimate use of bidirectional text controls in filenames (e.g. some right-to-left
      language document names) - investigate the rendered vs true extension
level: high
