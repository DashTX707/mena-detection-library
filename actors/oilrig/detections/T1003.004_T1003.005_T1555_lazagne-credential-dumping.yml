title: Credential Dumping via LaZagne (OilRig)
id: 7671786e-d623-4ee9-95c0-ba215a25ab4d
status: experimental
description: |
    Detects execution of the LaZagne credential-recovery tool, which OilRig uses to steal credentials
    from password stores, LSA secrets and cached domain credentials. Keys on the LaZagne binary
    name/metadata and its characteristic module arguments (all/browsers/lsa/wifi) rather than a
    specific hash, so a renamed LaZagne is still caught.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.credential-access
    - attack.t1003.004
    - attack.t1003.005
    - attack.t1555
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith: '\lazagne.exe'
        - OriginalFileName: 'lazagne.exe'
        - Product|contains: 'LaZagne'
    selection_args:
        CommandLine|contains|all:
            - 'lazagne'
        CommandLine|contains:
            - ' all'
            - ' browsers'
            - ' lsa'
            - ' windows'
            - ' -oN'
    condition: selection_tool or selection_args
falsepositives:
    - Sanctioned red-team or penetration-testing engagements using LaZagne
    - Security auditing tooling that bundles LaZagne modules
level: high
