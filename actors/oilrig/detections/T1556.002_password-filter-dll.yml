title: Password Filter DLL Registration under LSA (OilRig)
id: 112e9c43-dd37-471b-b9f4-4efdf8397f70
status: experimental
description: |
    Detects registration of a password filter (Notification Package) DLL under the LSA configuration
    key, matching OilRig's Earth Simnavaz hallmark of dropping a password filter DLL on domain
    controllers to harvest plaintext credentials. Modification of the 'Notification Packages' value
    under HKLM\SYSTEM\CurrentControlSet\Control\Lsa is a rare, high-fidelity signal.
references:
    - https://attack.mitre.org/groups/G0049/
    - https://www.trendmicro.com/en_us/research/24/j/earth-simnavaz-cyberattacks.html
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.credential-access
    - attack.t1556.002
    - mena-detection-library.oilrig
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\CurrentControlSet\Control\Lsa'
        TargetObject|endswith:
            - '\Notification Packages'
            - '\Authentication Packages'
    filter_default:
        Details|contains: 'scecli'
        Details|contains: 'rassfm'
    condition: selection and not filter_default
falsepositives:
    - Legitimate installation of a third-party password-complexity/filter product (rare; verify the DLL)
    - Domain-controller build automation writing the default package list
level: high
