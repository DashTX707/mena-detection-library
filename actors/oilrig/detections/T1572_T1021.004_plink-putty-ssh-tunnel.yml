title: SSH Tunneling and Access via Plink/PuTTY (OilRig)
id: ee725282-4234-4ffa-b702-f317aad2efa2
status: experimental
description: |
    Detects OilRig's use of the Plink and PuTTY utilities to create tunnels to C2 servers and to access
    compromised systems over SSH. Keys on the Plink/PuTTY binaries (including renamed copies via
    metadata) and on the port-forwarding switches (-R/-L/-D) used to build tunnels.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.command-and-control
    - attack.lateral-movement
    - attack.t1572
    - attack.t1021.004
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith:
              - '\plink.exe'
              - '\putty.exe'
        - OriginalFileName:
              - 'Plink'
              - 'PuTTY'
        - Product|contains: 'PuTTY suite'
    selection_tunnel_args:
        CommandLine|contains:
            - ' -R '
            - ' -L '
            - ' -D '
            - ' -pw '
            - ' -N '
            - ' -ssh '
        CommandLine|contains:
            - ':127.0.0.1:'
            - ':localhost:'
            - ' -pw '
    condition: selection_tool or selection_tunnel_args
falsepositives:
    - Administrators legitimately using PuTTY/Plink for SSH to managed devices (baseline hosts/operators)
    - Automation that builds SSH tunnels to sanctioned endpoints
level: medium
