title: Local Account and Group Enumeration via net (OilRig)
id: 60d43cc4-dd5b-4486-9e6a-81b27c330686
status: experimental
description: |
    Detects local account and local-group enumeration using the Windows net command, matching
    OilRig's documented use of 'net user' and 'net localgroup administrators' to enumerate local
    accounts and find local administrators on victim systems. Behavior-based on the net / net1
    command rather than a specific parent or task name.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.discovery
    - attack.t1087.001
    - attack.t1069.001
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - 'localgroup administrators'
            - 'localgroup'
            - ' user'
    filter_domain:
        CommandLine|contains: '/domain'
    condition: selection and not filter_domain
falsepositives:
    - Administrators and helpdesk staff enumerating local accounts and administrators
    - Inventory and endpoint-management automation querying local group membership
level: medium
