title: On-Host Payload Decoding via certutil / PowerShell (OilRig)
id: 8f7c5b06-7888-4d58-abf2-06f43b05ecdb
status: experimental
description: |
    Detects on-host decoding of encoded payloads, matching OilRig's use of certutil to decode
    base64-encoded files and its macro-driven PowerShell command to decode file contents. Keys on
    certutil -decode and PowerShell FromBase64String decode routines.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.stealth
    - attack.t1140
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-decode'
            - '/decode'
            - 'decodehex'
    selection_ps_decode:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains: 'FromBase64String'
    condition: selection_certutil or selection_ps_decode
falsepositives:
    - Administrative scripts that legitimately decode base64 configuration blobs
    - certutil used for certificate encoding/decoding in PKI workflows
level: medium
