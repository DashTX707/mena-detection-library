title: Windows Credential Manager Theft via VALUEVAULT / vaultcmd (OilRig)
id: 7494ab43-4cf7-4143-8fae-bc03c53fa85a
status: experimental
description: |
    Detects OilRig's VALUEVAULT credential-stealer and generic dumping of the Windows Credential
    Manager / Vault. Keys on the VALUEVAULT binary name/metadata and on vaultcmd.exe enumeration of
    stored credentials, which is how the Windows Vault is read programmatically.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.credential-access
    - attack.t1555.004
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith: '\valuevault.exe'
        - OriginalFileName: 'ValueVault.exe'
        - CommandLine|contains: 'valuevault'
    selection_vaultcmd:
        Image|endswith: '\vaultcmd.exe'
        CommandLine|contains:
            - '/listcreds'
            - '/list'
    condition: selection_tool or selection_vaultcmd
falsepositives:
    - Administrators auditing stored credentials with vaultcmd
    - Credential-migration or backup tooling that enumerates the Windows Vault
level: high
