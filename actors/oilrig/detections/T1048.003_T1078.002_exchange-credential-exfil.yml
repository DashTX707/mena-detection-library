title: Exchange/FTP Credential Exfiltration via STEALHOOK (OilRig)
id: afbc4715-e9e7-4448-830a-6fd8fe61ab22
status: experimental
description: |
    Detects OilRig's Earth Simnavaz exfiltration chain, in which the STEALHOOK tool retrieves valid
    domain credentials and exfiltrates them through the compromised organization's Microsoft Exchange
    server, and OilRig's separate use of FTP for exfiltration. Keys on the STEALHOOK binary and on
    command-line FTP/Exchange-EWS interaction from unexpected processes. Endpoint-only visibility is
    partial here — pair with mailbox-audit and Exchange transport analytics.
references:
    - https://attack.mitre.org/groups/G0049/
    - https://www.trendmicro.com/en_us/research/24/j/earth-simnavaz-cyberattacks.html
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.exfiltration
    - attack.t1048.003
    - attack.t1078.002
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith: '\stealhook.exe'
        - OriginalFileName: 'StealHook.exe'
        - CommandLine|contains: 'stealhook'
    selection_ftp:
        Image|endswith:
            - '\ftp.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'ftp://'
            - 'System.Net.FtpWebRequest'
            - '-Command ftp'
    selection_ews:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'Microsoft.Exchange.WebServices'
    condition: selection_tool or selection_ftp or selection_ews
falsepositives:
    - Legitimate FTP transfers by administrators or backup jobs
    - Sanctioned scripts using the Exchange Web Services managed API
level: medium
