title: Ingress Tool Transfer via certutil / PowerShell / bitsadmin (OilRig)
id: e5f2b363-2676-4025-aa9f-0091279c1b9c
status: experimental
description: |
    Detects remote file download to disk, matching OilRig's downloading of additional files onto
    victim infrastructure using certutil, PowerShell and other LOLBins. Keys on
    DownloadFile/Invoke-WebRequest-to-path, certutil -urlcache and bitsadmin /transfer fetching remote
    content.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.command-and-control
    - attack.t1105
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps_download:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'DownloadFile('
            - 'Invoke-WebRequest'
            - 'Start-BitsTransfer'
            - 'wget '
            - 'curl '
        CommandLine|contains:
            - '-outfile'
            - '.exe'
            - '.dll'
            - '\Temp\'
            - '\ProgramData\'
    selection_lolbin_download:
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\curl.exe'
        CommandLine|contains:
            - '-urlcache'
            - '/transfer'
            - 'http://'
            - 'https://'
    condition: selection_ps_download or selection_lolbin_download
falsepositives:
    - Software deployment and patching tools that download installers
    - Legitimate use of BITS/certutil for content delivery (baseline destinations)
level: medium
