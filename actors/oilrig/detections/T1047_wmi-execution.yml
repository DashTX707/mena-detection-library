title: WMI Process Creation for Execution (OilRig)
id: 85f9f5a1-0a43-4bc3-9331-9c473e03946d
status: experimental
description: |
    Detects use of WMI to spawn processes, matching OilRig's use of WMI for execution. Keys on wmic
    process call create and on WmiPrvSE spawning script interpreters, both of which indicate
    WMI-driven execution rather than benign queries.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.execution
    - attack.t1047
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'process'
            - 'call'
            - 'create'
    selection_wmiprvse_child:
        ParentImage|endswith: '\WmiPrvSE.exe'
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: selection_wmic or selection_wmiprvse_child
falsepositives:
    - Legitimate remote administration and software deployment that uses wmic process call create
    - Monitoring agents invoking scripts through WMI
level: medium
