title: Browser Credential and Cookie Theft via CDumper/EDumper/MKG (OilRig)
id: 545d87ac-8297-4da4-90e0-94459f520b5f
status: experimental
description: |
    Detects OilRig's browser data-stealer tooling (MKG for Chrome enumeration, CDumper and EDumper
    for cookies) and generic access to browser credential and cookie stores. Keys on the tool binary
    names/metadata and on process access to Login Data / Cookies / logins.json profile files by
    non-browser processes.
references:
    - https://attack.mitre.org/groups/G0049/
author: mena-detection-library
date: 2026-08-28
tags:
    - attack.discovery
    - attack.credential-access
    - attack.t1217
    - attack.t1555.003
    - mena-detection-library.oilrig
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith:
              - '\mkg.exe'
              - '\cdumper.exe'
              - '\edumper.exe'
        - OriginalFileName:
              - 'CDumper.exe'
              - 'EDumper.exe'
    selection_store_access:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Default\Network\Cookies'
            - '\User Data\Default\Cookies'
            - '\User Data\Local State'
            - '\logins.json'
            - '\cookies.sqlite'
    filter_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
    condition: selection_tool or (selection_store_access and not filter_browser)
falsepositives:
    - Backup or profile-migration utilities that legitimately read browser profile files
    - Endpoint DLP or password-manager import tooling
level: high
