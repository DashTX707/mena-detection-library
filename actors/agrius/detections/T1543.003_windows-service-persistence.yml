title: Windows Service Created for Backdoor Persistence (Agrius)
id: 720e2869-9392-45f4-8b7c-4601f1f8f85e
status: experimental
description: |
    Detects creation of a Windows service pointing at a binary in a user-writable path or launching an
    interpreter, matching Agrius registration of the IPsec Helper .NET backdoor as a Windows service for
    persistence. Keys on sc.exe create / service-install command lines with a suspicious binPath and on
    Service Control Manager service-installed events for binaries staged outside standard system paths.
references:
    - https://attack.mitre.org/groups/G1030/
    - https://www.sentinelone.com/labs/from-wiper-to-ransomware-the-evolution-of-agrius/
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.persistence
    - attack.t1543.003
    - mena-detection-library.agrius
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc_create:
        Image|endswith: '\sc.exe'
        CommandLine|contains: 'create'
        CommandLine|contains: 'binPath'
    selection_sc_suspicious_path:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - '\Windows\Temp\'
            - '\ProgramData\'
            - '\Users\Public\'
            - '\AppData\'
            - 'powershell'
            - 'cmd /c'
            - 'cmd.exe /c'
            - 'rundll32'
    condition: selection_sc_create and selection_sc_suspicious_path
falsepositives:
    - Legitimate software installers and management agents that register services (baseline vendor binaries/paths)
    - Sanctioned administrative service deployment (baseline operators/hosts)
level: medium
