title: POLONIUM Masqueraded Obfuscated Implant Binaries from User-Writable Paths
id: da6ba3b4-aeb5-4c93-9dba-bd5e6f8b9caa
status: experimental
description: |
    Detects execution of POLONIUM implant/module executables that masquerade as legitimate software
    while running from user-writable paths (T1036.005 Match Legitimate Name or Location, T1027.013
    Encrypted/Encoded File - the same binaries are packed with the AsStrongAsFuck .NET obfuscator).
    Named binaries include Mega.exe, DropBox.exe, OnDrive.exe, WinUpdate.exe, WinSc.exe, Device.exe,
    Regestries.exe and 'Microsoft Malware Protection.exe'. Keys on these legitimate-looking names
    executing from Users/AppData/ProgramData/Temp/Public, excluding genuine vendor install folders.
references:
    - https://www.welivesecurity.com/2022/10/11/polonium-targets-israel-creepy-malware/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.stealth
    - attack.t1036.005
    - attack.t1027.013
    - mena-detection-library.polonium
logsource:
    product: windows
    category: process_creation
detection:
    selection_names:
        Image|endswith:
            - '\Mega.exe'
            - '\DropBox.exe'
            - '\OnDrive.exe'
            - '\WinUpdate.exe'
            - '\WinSc.exe'
            - '\Device.exe'
            - '\Regestries.exe'
            - '\Microsoft Malware Protection.exe'
    selection_path:
        Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\ProgramData\'
            - '\Temp\'
            - '\Public\'
    filter_legit:
        Image|contains:
            - '\AppData\Roaming\Dropbox\'
            - '\AppData\Local\Dropbox\'
            - '\AppData\Local\Microsoft\OneDrive\'
            - '\AppData\Local\MEGAsync\'
    condition: selection_names and selection_path and not filter_legit
falsepositives:
    - Portable or user-profile installations of genuine Dropbox/OneDrive/MEGA - verify the file signer
      and hash; genuine binaries are Authenticode-signed by the vendor
level: high
