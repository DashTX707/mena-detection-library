title: POLONIUM Creep Backdoor Spawning Windows Command Shell
id: 7a0b4d5e-4e5f-4c3d-9d54-5d9e0f2b3c44
status: experimental
description: |
    Detects a POLONIUM Creep-family backdoor spawning cmd.exe to execute received commands
    (T1059.003 Windows Command Shell). The C#/C++ backdoors DeepCreep, MegaCreep, TechnoCreep and
    PapaCreep run tasking through the command shell and return output over their C2 channels. Keys on
    process lineage: a masqueraded implant executable (Mega.exe, DropBox.exe, OnDrive.exe, WinSc.exe,
    Device.exe, Regestries.exe, DeepCreep.exe) as the parent of cmd.exe running a command string.
references:
    - https://www.welivesecurity.com/2022/10/11/polonium-targets-israel-creepy-malware/
    - https://attack.mitre.org/groups/G1005/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.execution
    - attack.t1059.003
    - mena-detection-library.polonium
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\cmd.exe'
        ParentImage|endswith:
            - '\Mega.exe'
            - '\DropBox.exe'
            - '\OnDrive.exe'
            - '\WinSc.exe'
            - '\Device.exe'
            - '\Regestries.exe'
            - '\DeepCreep.exe'
    condition: selection
falsepositives:
    - Unlikely - the parent set is specific to POLONIUM implant filenames; verify the parent binary
      path and signer before dismissing
level: high
