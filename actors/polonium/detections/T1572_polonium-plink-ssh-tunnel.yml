title: POLONIUM Plink SSH Tunneling / Port Forwarding
id: 2fb0f809-f30a-4be8-8c0f-02adbed0e1ff
status: experimental
description: |
    Detects the PuTTY Plink SSH client being executed with tunneling / port-forwarding arguments
    (T1572 Protocol Tunneling). POLONIUM uses Plink to build SSH tunnels (including redundant tunnels)
    to its VPS infrastructure for network access and C2 relaying. Keys on plink.exe (or a renamed
    binary with Plink's OriginalFileName) invoked with -R/-L/-D forwarding, -N (no shell) or -pw
    (inline password) flags. SSH tunneling from a non-admin workstation is a strong signal.
references:
    - https://www.microsoft.com/en-us/security/blog/2022/06/02/exposing-polonium-activity-and-infrastructure-targeting-israeli-organizations/
    - https://www.welivesecurity.com/2022/10/11/polonium-targets-israel-creepy-malware/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.command-and-control
    - attack.t1572
    - mena-detection-library.polonium
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\plink.exe'
        - OriginalFileName: 'Plink'
    selection_flags:
        CommandLine|contains:
            - ' -R '
            - ' -L '
            - ' -D '
            - ' -N '
            - ' -pw '
    condition: selection_img and selection_flags
falsepositives:
    - Administrators using Plink for legitimate SSH tunnels/automation - restrict to expected admin
      hosts/accounts and confirm the remote destination
level: high
