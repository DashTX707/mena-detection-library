title: HEXANE Office Document Macro Spawning Interpreter (DanDrop / DanBot Delivery)
id: 280f1c0d-9fdd-4574-a20e-5b7b57c91cd0
status: experimental
description: |
    Detects the core HEXANE / Lyceum initial-execution behavior: a macro-enabled Microsoft Office
    document (the DanDrop VBA dropper delivered via spearphishing attachment) spawning a command
    interpreter or script host after the victim enables macros, dropping the DanBot backdoor
    (T1566.001 spearphishing attachment, T1204.002 user execution of a malicious file, T1059.005
    Visual Basic via VBA, T1059.003 Windows command shell). Keys on Office applications
    (winword/excel/powerpnt/outlook) as parent processes of cmd/powershell/wscript/cscript/mshta/
    rundll32/regsvr32 - a strong process-lineage anomaly. Requires process-creation logging with
    parent image and command lines.
references:
    - https://www.secureworks.com/research/lyceum-takes-center-stage-in-middle-east-campaign
    - https://attack.mitre.org/groups/G1001/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.initial-access
    - attack.execution
    - attack.t1566.001
    - attack.t1204.002
    - attack.t1059.005
    - attack.t1059.003
    - mena-detection-library.hexane
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\mspub.exe'
            - '\visio.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Office add-ins or enterprise templates that legitimately shell out to helper scripts - baseline
      expected macros and signed add-ins per business unit
    - Legitimate document-automation workflows - allowlist known parent/child command lines
level: high
