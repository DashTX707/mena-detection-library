title: HEXANE Password Spraying Against Exchange / OWA / O365
id: 93497373-18c0-49eb-aed1-bb4f333be5ac
status: experimental
description: |
    Detects the signature HEXANE / Lyceum initial-access technique: password spraying against
    internet-facing authentication (Exchange/OWA, Office 365, Entra ID) - a small set of common
    passwords tried across many distinct accounts to obtain valid credentials while avoiding lockouts
    (T1110 brute force, T1110.003 password spraying). Keys on failed sign-ins (invalid password /
    account-related result codes) and is best operated as a per-tenant threshold analytic on the
    count of DISTINCT targeted accounts from a single source IP/ASN within a short window. Requires
    Entra ID / Azure AD sign-in logs.
references:
    - https://www.secureworks.com/research/lyceum-takes-center-stage-in-middle-east-campaign
    - https://attack.mitre.org/groups/G1001/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1110
    - attack.t1110.003
    - mena-detection-library.hexane
logsource:
    product: azure
    service: signinlogs
detection:
    selection_failed:
        ResultType:
            - 50126
            - 50053
            - 50055
            - 50056
            - 50076
    selection_spray_client:
        ClientAppUsed:
            - 'Other clients'
            - 'IMAP4'
            - 'POP3'
            - 'SMTP'
            - 'Exchange ActiveSync'
            - 'Authenticated SMTP'
    condition: selection_failed and selection_spray_client
falsepositives:
    - Misconfigured applications or shared devices generating bulk failed logons - baseline expected
      service accounts and source IPs
    - Legitimate authorized penetration tests - allowlist testing windows and source addresses
level: high
