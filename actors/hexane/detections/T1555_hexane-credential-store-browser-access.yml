title: HEXANE Credential Theft from Password Stores and Web Browsers
id: feb232a8-7760-476c-8b3e-7973e127caae
status: experimental
description: |
    Detects HEXANE / Lyceum credential-harvesting activity against local password stores and browser
    credential databases (T1555 credentials from password stores, T1555.003 credentials from web
    browsers). Keys on non-browser processes accessing or copying browser Login Data / credential
    files (Chrome/Edge 'Login Data', Firefox logins.json / key4.db, Windows Vault / Credential
    Manager paths), and on command lines referencing these stores - the behavior of HEXANE's
    credential-harvester tool. Requires process-creation logging with command lines (and, ideally,
    file-access telemetry on the credential stores).
references:
    - https://attack.mitre.org/groups/G1001/
    - https://www.clearskysec.com/siamesekitten/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1555
    - attack.t1555.003
    - mena-detection-library.hexane
logsource:
    category: process_creation
    product: windows
detection:
    selection_store:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Default\Web Data'
            - 'logins.json'
            - 'key4.db'
            - 'signons.sqlite'
            - '\Microsoft\Credentials\'
            - '\Microsoft\Vault\'
            - 'vaultcmd'
    selection_notbrowser:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\cscript.exe'
            - '\wscript.exe'
            - '\rundll32.exe'
    condition: selection_store and selection_notbrowser
falsepositives:
    - Backup, migration or browser-sync utilities touching Login Data - baseline expected tools and
      hosts
    - Legitimate credential-management software - allowlist known signed processes
level: high
