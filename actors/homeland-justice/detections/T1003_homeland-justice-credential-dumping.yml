title: Homeland Justice OS Credential Dumping - LSASS and SAM Hive Access
id: 4bc44ae6-30d0-4c09-abc1-5af62492d7d4
status: experimental
description: |
    Detects OS credential dumping used by Homeland Justice / Storm-0842 (Iran/MOIS) during the
    long dwell in the Albanian government network, where Microsoft observed credential theft
    enabling reuse of valid accounts for RDP/VPN and lateral movement (T1003). Covers the
    common procedures: (1) command-line dumping of the LSASS process with comsvcs.dll
    MiniDump, rundll32, procdump, or Mimikatz-style keywords, and (2) exporting the
    SAM/SYSTEM/SECURITY registry hives via reg.exe save. LSASS process-access (Sysmon EID 10)
    with sensitive access masks is the higher-fidelity signal where available; this rule keys
    on the command-line surface for portability. Requires process-creation telemetry (Sysmon
    EID 1 / Security 4688) with command line.
references:
    - https://www.microsoft.com/en-us/security/blog/2022/09/08/microsoft-investigates-iranian-attacks-against-the-albanian-government/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1003
    - mena-detection-library.homeland-justice
logsource:
    category: process_creation
    product: windows
detection:
    selection_lsass_dump:
        CommandLine|contains:
            - 'comsvcs.dll, MiniDump'
            - 'comsvcs.dll MiniDump'
            - 'MiniDump lsass'
            - 'lsass.dmp'
            - 'procdump'
            - 'sekurlsa'
            - 'lsadump'
            - 'privilege::debug'
    selection_lsass_procdump:
        CommandLine|contains|all:
            - 'lsass'
            - '.dmp'
    selection_hive_save:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - 'save'
            - 'hklm\'
    selection_hive_names:
        CommandLine|contains:
            - '\sam'
            - '\system'
            - '\security'
    condition: selection_lsass_dump or selection_lsass_procdump or (selection_hive_save and selection_hive_names)
falsepositives:
    - Legitimate crash-dump or diagnostic collection touching lsass - allowlist approved
      support tooling and paths
    - Backup/migration processes exporting registry hives - baseline expected reg.exe save
      operations and their source accounts
level: high
