title: APT33 LSA Secrets Extraction and Protected Registry Hive Dump
id: a599e89d-b028-4092-bf6d-3135281a51cd
status: experimental
description: |
    Detects extraction of LSA secrets and dumping of protected registry hives used by APT33 to recover
    stored service/account credentials (T1003.004). Keys on reg.exe (or reg save/export) targeting the
    SECURITY, SYSTEM and SAM hives, and on access to the SECURITY\Policy\Secrets registry path used to
    read LSA secrets. Requires process-creation logging with command lines (and optionally registry
    auditing on the Secrets key).
references:
    - https://attack.mitre.org/groups/G0064
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.t1003.004
    - mena-detection-library.apt33
logsource:
    category: process_creation
    product: windows
detection:
    selection_regsave:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
            - 'save'
            - 'export'
        CommandLine|contains:
            - '\security'
            - '\system'
            - '\sam'
            - 'hklm\security'
            - 'hklm\system'
            - 'hklm\sam'
    selection_secrets:
        CommandLine|contains:
            - 'SECURITY\Policy\Secrets'
            - 'lsadump'
            - 'Get-LsaSecret'
    condition: selection_regsave or selection_secrets
falsepositives:
    - Legitimate backup or migration tooling exporting registry hives - baseline expected admin hosts and
      backup service accounts
    - Authorized IR/forensic collection - allowlist known responder tooling and windows
level: high
