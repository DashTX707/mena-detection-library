title: APT33 Peach Sandstorm Cloud Password Spray from TOR with go-http-client User Agent
id: f1983870-c48c-4ca5-b052-f09f1b935005
status: experimental
description: |
    Detects the signature APT33 / Peach Sandstorm cloud identity attack: large-scale, low-and-slow
    password spraying against Microsoft Entra ID (T1110.003, broader brute force T1110) routed through
    the TOR multi-hop proxy network (T1090.003) and issued by a non-browser 'go-http-client' user agent.
    Keys on failed interactive/non-interactive sign-ins carrying the go-http-client user agent - a strong
    high-fidelity signal because legitimate users authenticate with real browser/OS user agents. The 2023
    campaign throttled attempts to 09:00-17:00 Iran Standard Time from TOR exit nodes; correlate volume
    per source over a short window and cross-reference TOR exit-node threat intel for the client IP.
    Best operated as a per-tenant threshold analytic on distinct targeted accounts. Requires Entra ID
    sign-in logs.
references:
    - https://www.microsoft.com/en-us/security/blog/2023/09/14/peach-sandstorm-password-spray-campaigns-enable-intelligence-collection-at-high-value-targets/
    - https://attack.mitre.org/groups/G0064
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.command-and-control
    - attack.t1110.003
    - attack.t1110
    - attack.t1090.003
    - mena-detection-library.apt33
logsource:
    product: azure
    service: signinlogs
detection:
    selection_failed:
        ResultType:
            - 50126
            - 50053
            - 50055
            - 50056
            - 50076
    selection_ua:
        UserAgent|contains: 'go-http-client'
    condition: selection_failed and selection_ua
falsepositives:
    - Legitimate automation or SDK clients that emit a Go-based user agent against sign-in endpoints -
      baseline expected service principals and source IPs; the combination of failed auth at scale from
      TOR ASNs makes benign matches unlikely
    - Security scanners/pen-tests using go-http-client - allowlist authorized testing windows and sources
level: high
