title: APT33 Group Policy Preferences Password Recovery from SYSVOL
id: e6270eb5-faff-46a9-8cf7-a3f5215cf79c
status: experimental
description: |
    Detects recovery of Group Policy Preferences (GPP) passwords by APT33 (T1552.006): enumeration of the
    domain SYSVOL share for Groups.xml / Services.xml / ScheduledTasks.xml containing the cpassword
    attribute, and Get-GPPPassword-style access that decrypts them with the public AES key. Keys on
    command-line / script-block references to the GPP XML files, the cpassword attribute, the SYSVOL
    Policies path, and Get-GPPPassword. Requires process-creation or PowerShell script-block logging (and
    optionally SYSVOL file-share access auditing).
references:
    - https://attack.mitre.org/groups/G0064
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.t1552.006
    - mena-detection-library.apt33
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        CommandLine|contains:
            - 'Get-GPPPassword'
            - 'cpassword'
    selection_sysvol_xml:
        CommandLine|contains:
            - '\SYSVOL\'
            - '\Policies\'
        CommandLine|contains:
            - 'Groups.xml'
            - 'Services.xml'
            - 'ScheduledTasks.xml'
            - 'DataSources.xml'
            - 'Printers.xml'
    condition: selection_tool or selection_sysvol_xml
falsepositives:
    - Legitimate GPP auditing / remediation tooling scanning SYSVOL for cpassword - allowlist authorized
      security-hygiene scans and operators
    - Administrative scripts reading GPP XML - baseline expected admin hosts
level: medium
