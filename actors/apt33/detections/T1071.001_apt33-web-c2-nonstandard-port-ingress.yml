title: APT33 Script-Host Web C2 on Non-Standard Port and Ingress Tool Transfer
id: e5fca29f-70be-4b84-8f86-4d431c36e92a
status: experimental
description: |
    Detects the network side of APT33 TURNEDUP / POWERTON C2 and tool transfer: a script host or
    command-line download utility (curl, wscript, cscript, powershell, cmd, mshta, rundll32) making
    outbound connections over application-layer web protocols (T1071.001) to a non-standard destination
    port outside the common web set (T1571) and pulling additional components (T1105 ingress tool
    transfer). Keys on network-connection events whose initiating process is a script/download utility and
    whose destination port is not 80/443/53. Requires network-connection telemetry (Sysmon EID 3) with
    initiating-process attribution.
references:
    - https://www.mandiant.com/resources/blog/apt33-insights-into-iranian-cyber-espionage
    - https://attack.mitre.org/groups/G0064
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.command-and-control
    - attack.t1071.001
    - attack.t1571
    - attack.t1105
    - mena-detection-library.apt33
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Initiated: true
        Image|endswith:
            - '\curl.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
    filter_common_ports:
        DestinationPort:
            - 80
            - 443
            - 53
    condition: selection and not filter_common_ports
falsepositives:
    - Developer/automation use of curl/PowerShell to non-standard service ports (APIs, package mirrors) -
      baseline expected destinations and ports per host
    - Internal management traffic - allowlist known internal endpoints
level: medium
