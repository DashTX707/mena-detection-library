title: APT33 LSASS Memory Access for Credential Dumping
id: 88988d0e-cbf2-4cec-80e4-15bfaaf8de1f
status: experimental
description: |
    Detects credential access via LSASS memory dumping (T1003.001) on hosts compromised by APT33 to obtain
    additional accounts for lateral movement. Keys on cross-process access (Sysmon EID 10) to lsass.exe
    requesting a mask that combines PROCESS_VM_READ (0x0010) with PROCESS_QUERY_(LIMITED_)INFORMATION -
    e.g. the classic 0x1010 / 0x1410 / 0x1438 masks used by tools that read LSASS memory - from a
    non-allowlisted source process. The access mask is an implementation-core (L4) observable robust to
    tool renaming. Requires Sysmon EID 10 (ProcessAccess) telemetry - without it this rule will not
    populate (visibility gap).
references:
    - https://attack.mitre.org/groups/G0064
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.t1003.001
    - mena-detection-library.apt33
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    filter_known:
        SourceImage|endswith:
            - '\wininit.exe'
            - '\MsMpEng.exe'
            - '\csrss.exe'
            - '\services.exe'
    condition: selection and not filter_known
falsepositives:
    - EDR agents, AV and legitimate memory-inspection tools that open LSASS - baseline the SourceImage set
    - Some backup/diagnostic tools request broad masks - tune the allowlist to your environment
level: high
