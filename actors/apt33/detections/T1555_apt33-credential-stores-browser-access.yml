title: APT33 Credential Access from Password Stores and Web Browsers
id: 1fa4eb2b-cf6a-4c17-9ae6-846dd979ce44
status: experimental
description: |
    Detects harvesting of credentials from local password stores (T1555) and web browsers (T1555.003) by
    APT33 on compromised hosts. Keys on command-line access to Windows Credential Manager / vault
    (vaultcmd, cmdkey /list), and on a non-browser process referencing browser credential SQLite stores
    (Login Data, Web Data, the Chromium 'Local State' key file) for Chrome/Edge/Brave/Firefox. Requires
    process-creation logging with command lines (file-access telemetry improves fidelity for the browser
    store reads).
references:
    - https://attack.mitre.org/groups/G0064
author: mena-detection-library
date: 2026-08-29
tags:
    - attack.credential-access
    - attack.t1555
    - attack.t1555.003
    - mena-detection-library.apt33
logsource:
    category: process_creation
    product: windows
detection:
    selection_vault:
        CommandLine|contains:
            - 'vaultcmd /list'
            - 'cmdkey /list'
            - 'Get-VaultCredential'
            - 'Windows\System32\config\systemprofile\AppData\Local\Microsoft\Credentials'
    selection_browser_store:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Local State'
            - '\User Data\Default\Web Data'
            - '\Mozilla\Firefox\Profiles'
            - 'logins.json'
            - 'key4.db'
    condition: selection_vault or selection_browser_store
falsepositives:
    - Legitimate password managers, browser sync agents and backup tools reading credential stores -
      allowlist the known browser processes and management tooling
    - Admin use of cmdkey/vaultcmd - baseline expected admin hosts
level: medium
