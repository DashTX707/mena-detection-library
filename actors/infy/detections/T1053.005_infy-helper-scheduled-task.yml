title: Infy/Tonnerre helper.exe Scheduled-Task Persistence
id: 2a4c6e80-9b1d-4f37-8a5c-6d8e0f2a4c74
status: experimental
description: |
    Detects Tonnerre (Infy second-stage) persistence via a scheduled task that launches helper.exe on a
    recurring basis (T1053.005 Scheduled Task), complementing its Registry Run-key persistence. Keys on
    schtasks.exe task-creation command lines referencing helper.exe or a user-writable execution path,
    and on Task Scheduler task-registration events. A scheduled task launching helper.exe from a
    temp/AppData/ProgramData path is the durable actor signal.
references:
    - https://research.checkpoint.com/2021/after-lightning-comes-thunder/
    - https://unit42.paloaltonetworks.com/unit42-prince-persia-ride-lightning-infy-returns-foudre/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.persistence
    - attack.t1053.005
    - mena-detection-library.infy
logsource:
    category: process_creation
    product: windows
detection:
    selection_schtasks:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    selection_target:
        CommandLine|contains:
            - 'helper.exe'
            - 'SnailDriver'
            - '\ProgramData\'
            - '\AppData\'
            - '\Temp\'
    condition: selection_schtasks and selection_target
falsepositives:
    - Legitimate software or administrators creating scheduled tasks that run helpers from ProgramData
      - baseline expected task actions and creating accounts; a task launching helper.exe from a
      user-writable path is the actor pattern
level: high
