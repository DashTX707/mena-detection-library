title: Infy Password-Protected Staging Archive Creation
id: c7e9a1b3-5d2f-4c68-9a0b-2d4f6e8a0cc9
status: experimental
description: |
    Detects Infy collection and staging of captured data prior to exfiltration (T1560.001 Archive via
    Utility, T1074.001 Local Data Staging, T1027.013 Encrypted/Encoded File). Infy compresses captured
    documents into password-protected archives (document-capture password 'Z8(2000_2001uI)') and ships
    payloads inside SFX archives encrypted with the key '1qaz2wsx3edc', staging encrypted data on the
    host before egress. Keys on archive-utility process execution with add/compress and password flags,
    or the actor's known archive passwords. A password-protected archive of collected data created
    shortly before an outbound transfer is the actor pattern.
references:
    - https://unit42.paloaltonetworks.com/prince-of-persia-infy-malware-active-in-decade-of-targeted-attacks/
    - https://unit42.paloaltonetworks.com/unit42-prince-of-persia-game-over/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.collection
    - attack.stealth
    - attack.t1560.001
    - attack.t1074.001
    - attack.t1027.013
    - mena-detection-library.infy
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        Image|endswith:
            - '\7z.exe'
            - '\7za.exe'
            - '\rar.exe'
            - '\winrar.exe'
            - '\WinRAR.exe'
    selection_password:
        CommandLine|contains:
            - ' -hp'
            - ' -p'
            - 'Z8(2000_2001uI)'
            - '1qaz2wsx3edc'
    condition: selection_tool and selection_password
falsepositives:
    - Legitimate use of 7-Zip/WinRAR for password-protected backups and packaging - baseline expected
      archiving hosts and destinations; password-protected archives of sensitive folders immediately
      before egress, or use of the actor's known passwords, are the signal
level: medium
