title: Infy Browser Credential and Cookie Store Theft by Loader Process
id: 0a2c4e6f-8b1d-4a39-9c5e-7d9f1b3c5dfc
status: experimental
description: |
    Detects Infy / Tonnerre theft of browser credentials and session cookies (T1555.003 Credentials from
    Web Browsers, T1539 Steal Web Session Cookie). Infy steals saved passwords, form data, history and
    cookies from Edge, Internet Explorer, Chrome, Opera and Firefox; Tonnerre also collects cookies. Keys
    on a non-browser loader/implant process (rundll32/helper.exe/fwupdate.temp) touching browser
    credential-store and cookie-database files (Login Data, logins.json, cookies.sqlite, the Cookies /
    Network\Cookies stores). A loader process copying or writing browser credential/cookie stores is the
    durable behavioral signal; monitoring browser store paths as file events strengthens this.
references:
    - https://unit42.paloaltonetworks.com/prince-of-persia-infy-malware-active-in-decade-of-targeted-attacks/
    - https://research.checkpoint.com/2021/after-lightning-comes-thunder/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1555.003
    - attack.t1539
    - mena-detection-library.infy
logsource:
    category: file_event
    product: windows
detection:
    selection_proc:
        Image|endswith:
            - '\rundll32.exe'
            - '\helper.exe'
            - '\fwupdate.temp'
    selection_store:
        TargetFilename|contains:
            - '\Login Data'
            - '\logins.json'
            - '\cookies.sqlite'
            - '\Network\Cookies'
            - '\Cookies'
            - '\Web Data'
    condition: selection_proc and selection_store
falsepositives:
    - Backup or security tooling that copies browser profile files - baseline expected access to browser
      credential stores; a loader process (rundll32/helper.exe) touching Login Data / cookies databases
      is the actor pattern
level: high
