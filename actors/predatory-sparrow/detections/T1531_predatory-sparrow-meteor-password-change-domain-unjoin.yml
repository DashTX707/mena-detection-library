title: Predatory Sparrow Meteor Account Access Removal - Password Change and Forced Domain Unjoin
id: 43249781-58e9-4d0c-b2af-4443ef84a100
status: experimental
description: |
    Detects the Predatory Sparrow / MeteorExpress Meteor wiper account-lockout behavior (T1531 Account Access
    Removal): the wiper changes user passwords, removes the host from its domain redundantly via WinAPI and WMI,
    and logs off local sessions to cut administrators off and block quick DC-driven remediation. Keys on the
    net user password-reset command line, wmic/PowerShell domain-unjoin (RemoveComputer / UnjoinDomainOrWorkgroup),
    and forced session logoff. Behavior-based on the account-manipulation commands rather than a single tool name.
references:
    - https://www.sentinelone.com/labs/meteorexpress-mysterious-wiper-paralyzes-iranian-trains-with-epic-troll/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.impact
    - attack.t1531
    - mena-detection-library.predatory-sparrow
logsource:
    category: process_creation
    product: windows
detection:
    selection_passwd:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains: ' user '
        CommandLine|re: '(?i)net1?\.exe.* user .* /'
    selection_unjoin:
        CommandLine|contains:
            - 'UnjoinDomainOrWorkgroup'
            - 'Remove-Computer'
            - 'ComputerSystem.*Rename'
            - 'call unjoindomainorworkgroup'
    selection_logoff:
        CommandLine|contains:
            - 'shutdown /l'
            - 'logoff'
            - 'Win32Shutdown'
    condition: selection_passwd or selection_unjoin or selection_logoff
falsepositives:
    - Helpdesk password resets, legitimate domain migrations and session logoffs occur routinely - scope to
      bulk/scripted password changes across many accounts, forced unjoin, and clustering with the wiper sequence
level: high
