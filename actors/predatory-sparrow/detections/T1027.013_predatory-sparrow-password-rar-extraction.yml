title: Predatory Sparrow Password-Protected RAR Payload Extraction
id: 4a6e2d09-8c53-41b7-9f28-6d1a7c3e5b84
status: experimental
description: |
    Detects the Predatory Sparrow / MeteorExpress payload-unpacking stage: update.bat extracts three
    password-protected RAR archives (programs.rar, bcd.rar, ms.rar) using the hardcoded password
    'hackemall' to deliver the destructive binaries. Keys on WinRAR/7-Zip/unrar command lines carrying the
    actor's archive names or the '-phackemall' password switch, which conceal the encoded payloads from
    static inspection. Also relevant to the encrypted Meteor config (msconf.conf, XOR key 'abcdz').
references:
    - https://www.sentinelone.com/labs/meteorexpress-mysterious-wiper-paralyzes-iranian-trains-with-epic-troll/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.stealth
    - attack.t1027.013
    - mena-detection-library.predatory-sparrow
logsource:
    category: process_creation
    product: windows
detection:
    selection_archiver:
        Image|endswith:
            - '\rar.exe'
            - '\unrar.exe'
            - '\winrar.exe'
            - '\7z.exe'
            - '\7za.exe'
    selection_indicators:
        CommandLine|contains:
            - 'hackemall'
            - 'programs.rar'
            - 'bcd.rar'
            - 'ms.rar'
    condition: selection_archiver and selection_indicators
falsepositives:
    - Legitimate use of password-protected archives exists, but the specific 'hackemall' password and the
      programs.rar/bcd.rar/ms.rar names are actor-specific and should be treated as high fidelity
level: medium
