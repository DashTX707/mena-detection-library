title: Volatile Cedar Explosive RAT Implant Execution (Keylogging and Screen Capture)
id: 8f8b9e3c-25c6-471b-b4d6-3c4e5349ab3f
status: experimental
description: |
    Detects execution of the Volatile Cedar / Lebanese Cedar Explosive RAT implant, whose documented
    collection capabilities are keylogging (T1056.001 Input Capture) and desktop screenshot capture
    (T1113 Screen Capture) exfiltrated to its HTTP C2. The keylogging and screen-capture primitives
    themselves leave limited discrete host signal without EDR behavioral analytics, so this rule
    anchors on execution of the known Explosive sample set using MD5 image hashes as high-fidelity
    selectors, combined with the implant running from a user-writable directory rather than a system
    path. Pair with the Explosive HTTP C2 network rule for corroboration. Requires process-creation
    telemetry with hash fields (Sysmon Event ID 1).
references:
    - https://blog.checkpoint.com/security/volatilecedar/
    - https://securelist.com/sinkholing-volatile-cedar-dga-infrastructure/69421/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.collection
    - attack.t1056.001
    - attack.t1113
    - mena-detection-library.volatile-cedar
logsource:
    product: windows
    category: process_creation
