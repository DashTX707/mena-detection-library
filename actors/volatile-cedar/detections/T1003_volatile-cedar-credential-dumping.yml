title: Volatile Cedar OS Credential Dumping (LSASS MiniDump and SAM/SYSTEM Hive Export)
id: 82e5a465-e83f-4006-bff6-90cb39312b8a
status: experimental
description: |
    Detects Volatile Cedar / Lebanese Cedar credential harvesting to enable lateral movement and
    pass-the-hash (T1003 OS Credential Dumping). The reports do not name the specific dumping tool, so
    this rule keys on the two most common built-in dumping behaviors: (1) generating an LSASS process
    memory dump via the comsvcs.dll MiniDump export invoked through rundll32, and (2) exporting the
    SAM/SYSTEM/SECURITY registry hives with reg.exe save. Both are command-line-observable behaviors
    independent of any particular third-party tool.
references:
    - https://www.clearskysec.com/wp-content/uploads/2021/01/Lebanese-Cedar-APT.pdf
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1003
    - mena-detection-library.volatile-cedar
logsource:
    product: windows
    category: process_creation
detection:
    selection_comsvcs:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    selection_reghive:
        Image|endswith:
            - '\reg.exe'
            - '\reg1.exe'
        CommandLine|contains: ' save '
        CommandLine|contains:
            - '\sam'
            - '\system'
            - '\security'
    condition: 1 of selection_*
falsepositives:
    - Legitimate diagnostic memory dumps or backup/migration scripts that export registry hives -
      rare on servers; validate the invoking account, parent process and output path
level: high
