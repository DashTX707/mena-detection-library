title: Bahamut Office Document Macro Spawning Script Interpreter
id: 7b2e1c4a-3f6d-4a89-9c21-8d5e0f1a2b3c
status: experimental
description: |
    Detects a Microsoft Office application (Word, Excel, PowerPoint, Outlook) spawning a
    script interpreter or living-off-the-land child process, consistent with Bahamut
    (Windshift-clustered, G0112) spearphishing-attachment lures that use VBA macros to
    drop and run custom Windows payloads (T1566.001 Spearphishing Attachment, T1204.002
    User Execution: Malicious File, T1059.005 Visual Basic). Bahamut delivered malicious
    document/attachment lures to high-value individuals; on execution the Office host
    process spawns wscript/cscript/powershell/mshta/cmd to stage the next-stage binary.
    Keys on the office-parent -> script-child process lineage rather than any single sample.
references:
    - https://blogs.blackberry.com/en/2020/10/blackberry-uncovers-massive-hack-for-hire-group-targeting-governments-businesses-human-rights-groups-and-influential-individuals
    - https://attack.mitre.org/groups/G0112/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.initial-access
    - attack.execution
    - attack.t1566.001
    - attack.t1204.002
    - attack.t1059.005
    - mena-detection-library.bahamut
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\mspub.exe'
            - '\visio.exe'
    selection_child:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\mshta.exe'
            - '\cmd.exe'
            - '\regsvr32.exe'
            - '\rundll32.exe'
    condition: all of selection_*
falsepositives:
    - Enterprise Office templates or add-ins that legitimately launch scripted automation -
      baseline per environment and allowlist the specific signed automation before dismissing
    - Helpdesk or software-deployment macros invoking cmd/powershell
level: high
