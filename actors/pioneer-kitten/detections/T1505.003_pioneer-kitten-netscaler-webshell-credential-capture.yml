title: Pioneer Kitten NetScaler Web Shell and Credential-Capture File Deployment
id: df085b52-f46f-40f4-8a22-63c89aa1d507
status: experimental
description: |
    Detects Pioneer Kitten / Fox Kitten post-exploitation persistence on compromised Citrix NetScaler
    and edge appliances (T1505.003 Web Shell, T1133 External Remote Services, T1056 Input Capture).
    After exploiting the appliance the actor plants named PHP web shells and a credential-capture file
    into appliance web roots: /var/vpn/themes/imgs/ (netscaler.1, netscaler.php, ctxHeaderLogon.php),
    /netscaler/logon/LogonPoint/uiareas/ui_style.php, /netscaler/logon/sanpdebug.php, and creates the
    directory /xui/common/images/. Captured logon credentials are appended to a file named netscaler.1
    adjacent to the web shell. The backdoor version.dll is dropped into C:\Windows\ADFS\. Keys on
    file-integrity/file-create telemetry for these actor-specific filenames and paths; web shells that
    re-appear shortly after patching are especially high-fidelity. Requires appliance FIM or file-event
    telemetry (verify appliance logging is forwarded).
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
    - https://attack.mitre.org/groups/G0117/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.persistence
    - attack.initial-access
    - attack.credential-access
    - attack.t1505.003
    - attack.t1133
    - attack.t1056
    - mena-detection-library.pioneer-kitten
logsource:
    category: file_event
detection:
    selection_webshell:
        TargetFilename|endswith:
            - '\netscaler.php'
            - '/netscaler.php'
            - '\ctxHeaderLogon.php'
            - '/ctxHeaderLogon.php'
            - '\ui_style.php'
            - '/ui_style.php'
            - '\sanpdebug.php'
            - '/sanpdebug.php'
    selection_credfile:
        TargetFilename|endswith:
            - '\netscaler.1'
            - '/netscaler.1'
    selection_dir:
        TargetFilename|contains:
            - '/xui/common/images/'
            - '/var/vpn/themes/imgs/'
    selection_backdoor:
        TargetFilename|contains: '\Windows\ADFS\'
        TargetFilename|endswith: '\version.dll'
    condition: 1 of selection_*
falsepositives:
    - Legitimate appliance theme or web-root customization by administrators - correlate with change
      management and the appliance file baseline
level: high
