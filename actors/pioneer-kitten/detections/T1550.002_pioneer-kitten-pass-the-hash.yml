title: Pioneer Kitten Pass-the-Hash Authentication
id: bb9dc5b4-9491-4860-827d-f912058ae435
status: experimental
description: |
    Detects Pioneer Kitten / Fox Kitten reuse of harvested credential material, including NTLM hashes,
    to authenticate to additional systems (T1550.002 Use Alternate Authentication Material: Pass the
    Hash). Keys on the classic pass-the-hash logon signature: Windows Event ID 4624 network logon
    (LogonType 3) using NTLM with a logon process of NtLmSsp and a seclogo/explicit-credential pattern
    inconsistent with normal interactive use. Pass-the-hash is subtle and blends with legitimate NTLM;
    operate as an anomaly analytic keyed on privileged accounts authenticating via NTLM to hosts they
    do not normally reach. Requires detailed logon auditing.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
    - https://attack.mitre.org/groups/G0117/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.lateral-movement
    - attack.t1550.002
    - mena-detection-library.pioneer-kitten
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'NTLM'
        LogonProcessName: 'NtLmSsp'
    filter_anonymous:
        TargetUserName: 'ANONYMOUS LOGON'
    condition: selection and not filter_anonymous
falsepositives:
    - Legacy applications and systems that still rely on NTLM network logons - baseline expected NTLM
      usage per account/host; deploy as a Risk-Based-Alerting contribution focused on privileged
      accounts reaching new hosts
level: low
