title: Cotton Sandstorm Automated Password Guessing Against Exposed Accounts
id: 8511791c-5913-48d4-ad66-a16e8fbfd44d
status: experimental
description: |
    Detects automated password-guessing brute force against exposed accounts and services, an access
    technique used by Cotton Sandstorm / Emennet Pasargad (ASA) alongside reuse of credentials acquired
    from leaked datasets (T1110.001). Keys on a burst of authentication failures against one or many
    accounts from a single source over a short window, the classic high-failure fan-out that separates
    guessing from an ordinary fat-finger login. Correlate the source IP against commercial-VPN exit
    infrastructure and watch for a subsequent success from the same source (guessing that turned into
    valid-account access). Best operated as a per-source threshold analytic - deploy behind a > 30
    authentication failures per source IP over a 5-minute window aggregation (via the SIEM
    threshold/correlation layer). Requires authentication logs (Windows 4625, VPN/RADIUS, or
    application auth) with account and source-IP fields.
references:
    - https://www.ic3.gov/CSA/2024/241030.pdf
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-290a
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1110.001
    - mena-detection-library.cotton-sandstorm
logsource:
    category: authentication
detection:
    selection_fail:
        action: 'failure'
    condition: selection_fail
falsepositives:
    - Misconfigured service accounts or expired-credential clients retrying a stale password - baseline
      and exclude known service principals
    - Shared NAT/proxy egress aggregating many users behind one source IP
level: medium
