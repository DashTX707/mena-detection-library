title: Cotton Sandstorm External Defacement and Content Injection of Served Surfaces
id: 27e24799-df82-43e1-a06b-b2adfc4a612b
status: experimental
description: |
    Detects unauthorized modification of externally-served content - the influence payoff of Cotton
    Sandstorm / Emennet Pasargad (ASA) cyber-enabled information operations, in which the actor defaces
    or hijacks public surfaces to display crafted propaganda: injecting Israel-Hamas-war messaging into
    a compromised US IPTV stream ('For-Humanity'), pushing anti-Israel montages via a compromised French
    dynamic-display provider during the 2024 Olympics ('Regiment GUD'), and website defacements against
    Israeli targets (T1491.002, External Defacement). Keys on file-integrity-monitoring / write events
    to web-root, streaming-config or digital-signage content directories by an unexpected process, and
    on injected content referencing known actor persona strings. Pair with a 'known-good' external
    content baseline. Requires file-integrity-monitoring or web-content write-audit logging on the
    served content store.
references:
    - https://www.ic3.gov/CSA/2024/241030.pdf
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-290a
    - https://blogs.microsoft.com/on-the-issues/2024/10/23/as-the-u-s-election-nears-russia-iran-and-china-step-up-influence-efforts/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.impact
    - attack.t1491.002
    - mena-detection-library.cotton-sandstorm
logsource:
    category: file_event
    product: windows
detection:
    selection_path:
        TargetFilename|contains:
            - '\wwwroot\'
            - '\htdocs\'
            - '\www\'
            - '\public_html\'
            - '\signage\'
            - '\streams\'
        TargetFilename|endswith:
            - '.html'
            - '.htm'
            - '.php'
            - '.aspx'
            - '.js'
            - '.m3u8'
    filter_trusted:
        Image|endswith:
            - '\w3wp.exe'
            - '\msdeploy.exe'
            - '\devenv.exe'
    condition: selection_path and not filter_trusted
falsepositives:
    - Legitimate site deployments / CMS content publishing outside a change window - scope to trusted
      deploy accounts and maintenance windows
    - Auto-generated cache or streaming-manifest churn - exclude the specific generator process paths
level: high
