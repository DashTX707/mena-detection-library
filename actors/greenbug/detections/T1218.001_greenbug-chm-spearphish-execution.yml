title: Greenbug CHM Help File Execution Spawning Script Interpreters
id: 4f8a2c1e-9b3d-4e77-8a10-2c5f6d7e8a91
status: experimental
description: |
    Detects Greenbug (ISMDOOR/ISMAgent) initial-access execution where a malicious compiled HTML
    Help file delivered as a business-proposal spearphishing attachment (T1566.001) is opened by the
    victim (T1204.002) and executed through hh.exe (T1218.001), which then spawns a script interpreter
    to run the hidden payload. In the South Asia telecom campaign the lure was proposal_pakistan110.chm
    with an ADS-hidden error.html payload. hh.exe launching a CHM from a user-download path and
    spawning powershell.exe/cmd.exe/mshta.exe/wscript.exe is rare and high-fidelity.
references:
    - https://www.security.com/threat-intelligence/greenbug-espionage-telco-south-asia
    - https://www.security.com/threat-intelligence/shamoon-attacks-mount-middle-east
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.initial-access
    - attack.execution
    - attack.t1566.001
    - attack.t1204.002
    - attack.t1218.001
    - mena-detection-library.greenbug
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith: '\hh.exe'
    selection_child:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\rundll32.exe'
    selection_chm:
        ParentCommandLine|contains: '.chm'
    condition: selection_parent and (selection_child or selection_chm)
falsepositives:
    - Legitimate help-authoring or software installers that ship CHM files and invoke scripting hosts -
      validate the CHM path, the parent mail/browser process and the child command line before dismissing
level: high
