title: APT39 Brute Force / Credential Guessing - Authentication Failure Spike
id: ed5d5124-0bb2-4dfa-8fe1-7a63dc8c1c55
status: experimental
description: |
    Detects APT39 / Chafer brute-force and credential-guessing activity via spikes of failed logons
    (Event ID 4625). Keys on repeated authentication failures for one or many accounts from a source
    over a short window - the signal of password guessing or spraying against Windows/remote services.
    APT39 uses brute force to obtain account credentials; best operated as a per-source and per-account
    threshold analytic with account-lockout correlation. Requires Windows Security auditing of logon
    failures.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.mandiant.com/resources/blog/apt39-iranian-cyber-espionage-group-focused-on-personal-information
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1110
    - mena-detection-library.apt39
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType:
            - 3
            - 10
    condition: selection
falsepositives:
    - Misconfigured services/applications with stale credentials generating failure storms - baseline
      known noisy sources and service accounts
    - Users repeatedly mistyping passwords after a password change
level: medium
