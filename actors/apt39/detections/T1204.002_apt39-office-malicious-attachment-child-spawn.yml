title: APT39 Malicious Attachment - Office Application Spawning Script/Shell Child
id: c7f25083-1c1a-423e-a612-b90a55889a46
status: experimental
description: |
    Detects APT39 / Chafer spear-phishing attachment execution: a Microsoft Office application
    (Word, Excel, PowerPoint, Outlook) spawning a script interpreter, shell, or LOLBin after a user
    opens a macro-enabled document and enables content. Keys on Office parent images launching
    cmd/powershell/wscript/cscript/mshta/certutil/regsvr32/rundll32. APT39 sends malicious attachments
    (often macro documents) to targeted individuals; Office-to-child-process spawning is a core
    detectable execution behavior covering both the user-execution and spearphishing-attachment steps.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.mandiant.com/resources/blog/apt39-iranian-cyber-espionage-group-focused-on-personal-information
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.execution
    - attack.initial-access
    - attack.t1204.002
    - attack.t1566.001
    - mena-detection-library.apt39
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\mspub.exe'
            - '\onenote.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\certutil.exe'
            - '\regsvr32.exe'
            - '\rundll32.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate Office add-ins or business macros that shell out - allowlist the specific signed
      add-in / macro workflows and hosts
level: high
