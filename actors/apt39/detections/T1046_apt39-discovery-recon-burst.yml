title: APT39 Post-Exploitation Reconnaissance Burst (Host, Network, Share, Registry)
id: 7fadf07f-b567-4cf6-ac32-e2d4eced529d
status: experimental
description: |
    Detects the APT39 / Chafer post-exploitation discovery burst executed shortly after a foothold,
    frequently spawned by a web shell, script host, or PsExec. Covers remote system discovery
    (nbtscan / ping sweeps), network service discovery, network share enumeration (net view / net use),
    system owner/user discovery (whoami), and registry queries (reg query) against configuration keys.
    Individually common, these commands are high-value when clustered in a short window under a single
    non-interactive parent. Best operated as a per-host burst/threshold analytic.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.mandiant.com/resources/blog/apt39-iranian-cyber-espionage-group-focused-on-personal-information
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.discovery
    - attack.t1046
    - attack.t1018
    - attack.t1135
    - attack.t1033
    - attack.t1012
    - mena-detection-library.apt39
logsource:
    category: process_creation
    product: windows
detection:
    selection_remotesys:
        Image|endswith:
            - '\nbtscan.exe'
            - '\ping.exe'
        CommandLine|contains:
            - '/24'
            - '- '
    selection_share:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - ' view'
            - ' use'
    selection_user:
        Image|endswith: '\whoami.exe'
    selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains: ' query'
    selection_netsvc:
        Image|endswith:
            - '\nbtstat.exe'
            - '\arp.exe'
        CommandLine|contains:
            - ' -a'
            - ' -n'
    condition: 1 of selection_*
falsepositives:
    - Administrators and inventory/monitoring tools running discovery commands - baseline expected
      recon activity per host and alert on clustered bursts under script-host/web-worker parents
level: medium
