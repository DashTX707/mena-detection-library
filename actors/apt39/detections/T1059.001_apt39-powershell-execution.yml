title: APT39 Suspicious PowerShell Execution (POWBAT / Encoded / Download Cradle)
id: 464358b2-89cd-4e89-85b6-fac83ba027ea
status: experimental
description: |
    Detects APT39 / Chafer use of PowerShell (including POWBAT / POWERSTATS-adjacent tooling) to
    execute commands, download payloads, and run in-memory. Keys on high-signal PowerShell arguments -
    encoded commands, hidden/non-interactive execution, download cradles (Net.WebClient/Invoke-WebRequest),
    and in-memory execution (IEX). Highest fidelity when PowerShell is spawned by Office, a web-server
    worker, wscript/cscript, or another anomalous parent. Enable Script Block Logging (Event ID 4104)
    for deep coverage.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.mandiant.com/resources/blog/apt39-iranian-cyber-espionage-group-focused-on-personal-information
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.execution
    - attack.t1059.001
    - mena-detection-library.apt39
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flags:
        CommandLine|contains:
            - ' -enc'
            - ' -encodedcommand'
            - ' -e '
            - 'FromBase64String'
            - 'Net.WebClient'
            - 'DownloadString'
            - 'DownloadFile'
            - 'Invoke-Expression'
            - 'IEX('
            - ' -w hidden'
            - ' -windowstyle hidden'
            - ' -nop '
    condition: selection_img and selection_flags
falsepositives:
    - Legitimate administrative and deployment scripts that use encoded commands or download cradles -
      baseline expected automation and sign/allowlist known scripts
level: high
