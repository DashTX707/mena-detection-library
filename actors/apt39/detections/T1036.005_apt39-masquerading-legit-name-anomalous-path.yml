title: APT39 Masquerading - Legitimate System Binary Name in Anomalous Path
id: 708fac61-e5ee-4520-91d0-e08bdc6112a4
status: experimental
description: |
    Detects APT39 / Chafer masquerading: malware named after legitimate Windows binaries but executed
    from a non-standard, user-writable location instead of System32/SysWOW64. Keys on well-known system
    process names (svchost.exe, lsass.exe, services.exe, csrss.exe, rundll32.exe, taskhost.exe) running
    from Temp/AppData/ProgramData/Public/Downloads. A trusted system name outside its canonical path is
    a strong name/location-mismatch signal.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.mandiant.com/resources/blog/apt39-iranian-cyber-espionage-group-focused-on-personal-information
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.stealth
    - attack.t1036.005
    - mena-detection-library.apt39
logsource:
    category: process_creation
    product: windows
detection:
    selection_name:
        Image|endswith:
            - '\svchost.exe'
            - '\lsass.exe'
            - '\services.exe'
            - '\csrss.exe'
            - '\smss.exe'
            - '\winlogon.exe'
            - '\taskhost.exe'
            - '\taskhostw.exe'
    selection_path:
        Image|contains:
            - '\Users\'
            - '\Temp\'
            - '\AppData\'
            - '\ProgramData\'
            - '\PerfLogs\'
            - '\Downloads\'
    condition: selection_name and selection_path
falsepositives:
    - Rare portable apps or installers that ship binaries with system-like names - allowlist the
      specific signed file and path
level: high
