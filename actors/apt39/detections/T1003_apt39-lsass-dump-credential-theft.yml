title: APT39 Credential Theft - LSASS Dumping and Password-Store Access Tooling
id: db403fa3-8383-4bb0-8bd3-2a737ba59799
status: experimental
description: |
    Detects APT39 / Chafer credential-access tradecraft: execution of Mimikatz, ProcDump, and
    Windows Credential Editor (WCE) to dump OS credentials, dump LSASS process memory, and harvest
    credentials from password stores. Keys on ProcDump targeting lsass.exe (-ma lsass), Mimikatz
    command modules (sekurlsa::, lsadump::, vault::), and WCE flags, plus comsvcs.dll MiniDump abuse.
    APT39 has repeatedly used these publicly available tools after gaining a foothold to enable
    lateral movement with valid accounts.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.mandiant.com/resources/blog/apt39-iranian-cyber-espionage-group-focused-on-personal-information
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1003
    - attack.t1003.001
    - attack.t1555
    - mena-detection-library.apt39
logsource:
    category: process_creation
    product: windows
detection:
    selection_procdump:
        Image|endswith: '\procdump.exe'
        CommandLine|contains: 'lsass'
    selection_mimikatz:
        CommandLine|contains:
            - 'sekurlsa::'
            - 'lsadump::'
            - 'vault::cred'
            - 'privilege::debug'
    selection_wce:
        CommandLine|contains:
            - ' -w -o '
            - 'wceaux.dll'
        Image|endswith: '\wce.exe'
    selection_comsvcs:
        CommandLine|contains:
            - 'comsvcs.dll'
            - 'MiniDump'
    condition: selection_procdump or selection_mimikatz or selection_wce or selection_comsvcs
falsepositives:
    - Legitimate administrator use of ProcDump for application crash-dump collection - allowlist
      known support workflows and hosts
    - Endpoint security tools that reference these strings in telemetry
level: high
