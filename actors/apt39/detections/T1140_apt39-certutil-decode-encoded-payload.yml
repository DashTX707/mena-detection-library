title: APT39 Payload Deobfuscation and Encoded/Packed File Staging
id: 84cbabeb-8af9-4ce7-a281-3c044ba4ed2b
status: experimental
description: |
    Detects APT39 / Chafer deobfuscation/decoding of payloads at runtime and the staging of
    encrypted/encoded/packed files to evade static inspection. Keys on certutil -decode / -decodehex
    base64 decoding, PowerShell FromBase64String decode routines, and writes of high-entropy
    encoded/packed payloads (e.g. .b64, packer-stub names) to user-writable paths. APT39 base64-encodes
    payloads and staged data and decodes them on-host; certutil-based decode is directly observable in
    command lines.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.cisa.gov/news-events/analysis-reports/ar20-259a
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.stealth
    - attack.t1140
    - attack.t1027.013
    - attack.t1027.002
    - mena-detection-library.apt39
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - 'decode'
            - 'decodehex'
    selection_psdecode:
        CommandLine|contains|all:
            - 'FromBase64String'
            - 'IO.File'
    condition: selection_certutil or selection_psdecode
falsepositives:
    - Legitimate certificate encode/decode operations and developer base64 handling - allowlist known
      admin/PKI workflows and hosts
level: medium
