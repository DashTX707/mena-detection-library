title: APT39 Visual Basic Script Execution via wscript/cscript
id: ec1ce4cc-3987-4e3a-9965-d34cf79f4fce
status: experimental
description: |
    Detects APT39 / Chafer execution of Visual Basic scripts through the Windows Script Host
    (wscript.exe / cscript.exe), particularly VBS/VBE dropped to user-writable paths or spawned by an
    Office application after macro enablement. APT39 delivers macro/VBS-laden documents in spear-phishing
    to run payloads; script-host execution of files from Temp/AppData/Downloads or under an Office parent
    is a strong initial-execution signal.
references:
    - https://attack.mitre.org/groups/G0087/
    - https://www.mandiant.com/resources/blog/apt39-iranian-cyber-espionage-group-focused-on-personal-information
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.execution
    - attack.t1059.005
    - mena-detection-library.apt39
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
    selection_ctx:
        CommandLine|contains:
            - '.vbs'
            - '.vbe'
            - '.wsf'
            - '.js'
            - '\Temp\'
            - '\AppData\'
            - '\Downloads\'
    condition: selection_img and selection_ctx
falsepositives:
    - Legitimate business VBS/JS logon and administrative scripts - allowlist known script paths and
      signed enterprise automation
level: medium
