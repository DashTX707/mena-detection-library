title: Innocuously-Named Implant Binary in Unusual Path (Imperial Kitten Masquerading)
id: 0e06281d-1dc1-4d53-9109-5e8cde50a4ef
status: experimental
description: |
    Detects execution of binaries that masquerade as legitimate Windows/service components by name
    (e.g. WindowsServiceLive.exe, StandardKeyboard.exe) while running from a user-writable, non-system
    path. Imperial Kitten (CURIUM / Yellow Liderc) names its implant service binaries innocuously to
    blend in (T1036 Masquerading). Keys on the actor-specific benign-sounding filenames combined with
    an anomalous execution directory.
references:
    - https://www.crowdstrike.com/en-us/blog/imperial-kitten-deploys-novel-malware-families/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.stealth
    - attack.t1036
    - mena-detection-library.imperial-kitten
logsource:
    category: process_creation
    product: windows
detection:
    selection_name:
        Image|endswith:
            - '\WindowsServiceLive.exe'
            - '\StandardKeyboard.exe'
    selection_generic:
        Image|endswith:
            - '\svchost.exe'
            - '\services.exe'
            - '\lsass.exe'
    filter_syspath:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Windows\'
    condition: selection_name or (selection_generic and not filter_syspath)
falsepositives:
    - Legitimate third-party software using generic names outside System32 is uncommon - validate the
      binary signature and path
level: high
