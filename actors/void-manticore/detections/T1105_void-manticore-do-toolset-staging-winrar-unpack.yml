title: Void Manticore do.exe / do.zip Toolset Staging and WinRAR Unpack on Web Server
id: 05674184-a017-48d9-a50c-1a8986ab3ef5
status: experimental
description: |
    Detects Void Manticore (Storm-0842) ingress tool transfer and staging: after web-shell access the
    actor uploads its toolset (do.exe, do.zip, an additional reGeorge web shell) to ProgramData using
    Karma Shell's upload_file function, unpacks do.zip with WinRAR, then executes do.exe (T1105 Ingress
    Tool Transfer). Keys on WinRAR/archive-utility command lines referencing do.zip and on execution of
    do.exe from ProgramData, optionally parented by a web-server or archiver process. Pair with
    file-create telemetry for do.exe/do.zip written into ProgramData by a web-worker process. Requires
    process-creation telemetry with command line (Sysmon EID 1 / Security 4688); file-create telemetry
    (Sysmon EID 11) strengthens the staging half.
references:
    - https://research.checkpoint.com/2024/bad-karma-no-justice-void-manticore-destructive-activities-in-israel/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.command-and-control
    - attack.t1105
    - mena-detection-library.void-manticore
logsource:
    category: process_creation
    product: windows
detection:
    selection_unpack:
        Image|endswith:
            - '\rar.exe'
            - '\WinRAR.exe'
            - '\7z.exe'
        CommandLine|contains: 'do.zip'
    selection_exec:
        CommandLine|contains: '\ProgramData\do.exe'
    condition: selection_unpack or selection_exec
falsepositives:
    - Legitimate software named do.exe or archives named do.zip - verify the ProgramData path and the
      web-server/archiver parent lineage before escalating; allowlist known-good files by hash
    - Administrative use of WinRAR to unpack tooling into ProgramData - scope to authorized deployment
level: high
