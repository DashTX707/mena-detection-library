title: Arid Viper rar.exe Password-Protected Staging of Documents
id: 1b9f4c73-8a26-4d19-b7e0-2c5a9f3e6d81
status: experimental
description: |
    Detects Micropsia / PyMicropsia pre-exfiltration archiving (T1560.001 Archive via Utility, and the
    underlying T1005 Data from Local System). Arid Viper (APT-C-23) compresses collected Office documents
    (.doc/.docx/.xls/.xlsx/.pdf/.ppt/.pptx/.csv/.txt/.rtf) into password-protected RAR archives with
    rar.exe before uploading them over C2. Keys on a RAR utility invoked with a password-protection flag
    (-hp) and/or recursion (-r), evidencing both the archive step and the bulk collection of local
    documents it packages.
references:
    - https://unit42.paloaltonetworks.com/pymicropsia/
    - https://attack.mitre.org/groups/G1028/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.collection
    - attack.t1560.001
    - attack.t1005
    - mena-detection-library.arid-viper
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        - Image|endswith: '\rar.exe'
        - OriginalFileName: 'Rar.exe'
        - Image|endswith: '\WinRAR.exe'
    selection_pwflag:
        CommandLine|contains:
            - ' -hp'
            - ' -p'
    selection_docs:
        CommandLine|contains:
            - '.doc'
            - '.xls'
            - '.pdf'
            - '.ppt'
            - '.csv'
            - '.rtf'
    condition: selection_tool and (selection_pwflag or selection_docs)
falsepositives:
    - Administrators or backup tooling creating password-protected RAR archives of document folders -
      validate the parent process, destination archive path and account
level: high
