title: Arid Viper Ingress Tool Transfer from Persona C2 Domains
id: 2c8f1a56-7b94-4d03-b6e8-1f9a3c7d5b40
status: experimental
description: |
    Detects Arid Viper (APT-C-23) download-and-execute of additional payloads/modules from C2
    (T1105 Ingress Tool Transfer). PyMicropsia supports URL-based download-and-execute and Arid Gopher
    exposes 'd' (download/execute) and 'ra' (process-execute) commands; weaponized update payloads and
    APKs are also fetched from actor persona domains (e.g. orin-weimann[.]com/abc/Update Services.apk,
    signal.apk; jack-keys[.]site/download/*). Keys on retrieval of an executable / installer / APK from
    the known persona C2 domains.
references:
    - https://blog.talosintelligence.com/arid-viper-mobile-spyware/
    - https://www.deepinstinct.com/blog/arid-gopher-the-newest-micropsia-malware-variant
    - https://attack.mitre.org/groups/G1028/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.command-and-control
    - attack.t1105
    - mena-detection-library.arid-viper
logsource:
    category: proxy
detection:
    selection_domains:
        cs-host|contains:
            - 'orin-weimann.com'
            - 'jack-keys.site'
            - 'luis-dubuque.in'
            - 'conner-margie.com'
            - 'grace-fraser.site'
            - 'elizabeth-steiner.tech'
    selection_payload:
        c-uri|contains:
            - '.apk'
            - '.exe'
            - '.dll'
            - '.scr'
            - '/download/'
    condition: selection_domains and selection_payload
falsepositives:
    - Low; the persona-domain list is actor-specific - any executable/APK retrieval from these hosts is
      high priority
level: high
