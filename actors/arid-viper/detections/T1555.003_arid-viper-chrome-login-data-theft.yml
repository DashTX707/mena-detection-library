title: Arid Viper Chrome Login Data Access by Non-Browser Process
id: 3f7d9a2c-5b18-4c60-9e34-1a8f6c2d7b09
status: experimental
description: |
    Detects PyMicropsia's browser-credential theft (T1555.003 Credentials from Web Browsers). PyMicropsia
    exposes a 'Rapunzel' C2 command that reads Chrome's saved credentials by opening the 'Login Data'
    SQLite store in the Chrome user-data profile. Keys on a non-browser process referencing the Chrome
    'Login Data' path on its command line - a strong indicator of credential store access by something
    other than Chrome itself. Requires command-line or file-access instrumentation that captures the
    profile path.
references:
    - https://unit42.paloaltonetworks.com/pymicropsia/
    - https://blog.talosintelligence.com/arid-viper-mobile-spyware/
    - https://attack.mitre.org/groups/G1028/
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1555.003
    - mena-detection-library.arid-viper
logsource:
    category: process_creation
    product: windows
detection:
    selection_logindata:
        CommandLine|contains:
            - '\Google\Chrome\User Data\'
            - '\Login Data'
            - '\Web Data'
    filter_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
    condition: selection_logindata and not filter_browser
falsepositives:
    - Backup, sync or endpoint-management agents that legitimately read the Chrome profile - allowlist the
      specific signed tools by Image path
level: high
