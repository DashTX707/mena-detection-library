title: SideWinder StealerBot Credential Prompt and Input Capture from User-Writable Path
id: 7c1cdb03-7c29-48fb-8a04-091a2b3c4d5e
status: experimental
description: |
    Detects a process running from a user-writable directory loading the Windows credential-UI
    libraries (credui.dll / wincredui.dll), used to render a native credential prompt. This is
    the on-host behavior of the SideWinder (Rattlesnake / APT-C-17) StealerBot phishing/
    credential-capture module, which presents a fake Windows credential dialog to trick the
    victim into entering their password, and which also keylogs input. Anchors on a credential
    UI DLL being loaded by a process executing from AppData/ProgramData/Temp/Public rather than
    a signed program-files binary.
references:
    - https://thehackernews.com/2024/10/sidewinder-apt-strikes-middle-east-and.html
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.collection
    - attack.t1056.002
    - attack.t1056.001
    - mena-detection-library.sidewinder
logsource:
    category: image_load
    product: windows
detection:
    selection_mod:
        ImageLoaded|endswith:
            - '\credui.dll'
            - '\wincredui.dll'
    selection_path:
        Image|contains:
            - '\AppData\'
            - '\ProgramData\'
            - '\Users\Public\'
            - '\Temp\'
    condition: all of selection_*
falsepositives:
    - Portable legitimate applications that prompt for credentials and run from a user profile directory - allowlist by signed image and hash
level: medium
