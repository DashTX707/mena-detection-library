title: SideWinder StealerBot Browser Credential Store Access by Non-Browser Process
id: 6b0bcaf2-6b18-47ea-a9f3-f8091a2b3c4d
status: experimental
description: |
    Detects a non-browser process referencing Chromium/Edge credential store artifacts (the
    Login Data SQLite database, Local State DPAPI key material, or Cookies) on its command
    line, consistent with the SideWinder (Rattlesnake / APT-C-17) StealerBot module that steals
    saved passwords from web browsers. Browser credential files are normally accessed only by
    the browser itself, so access by a scripting/loader/unknown process is suspicious.
references:
    - https://thehackernews.com/2024/10/sidewinder-apt-strikes-middle-east-and.html
author: mena-detection-library
date: 2026-08-30
tags:
    - attack.credential-access
    - attack.t1555.003
    - mena-detection-library.sidewinder
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - '\User Data\Default\Login Data'
            - '\User Data\Local State'
            - '\Login Data'
            - '\Web Data'
            - '\Network\Cookies'
    filter_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\firefox.exe'
    condition: selection and not filter_browser
falsepositives:
    - Backup, migration or password-manager import tools that legitimately copy browser profile databases - allowlist by signed image and hash
level: high
